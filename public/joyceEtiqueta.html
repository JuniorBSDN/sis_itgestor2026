<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyce v.2 - Gerador de Etiquetas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0056b3;
            --light-blue: #e7f1ff;
            --bg: #f4f7f6;
            --text: #2c3e50;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 10px;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.2rem; color: var(--primary-blue); margin: 0; }

        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; color: #666; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,86,179,0.3);
        }

        /* ÁREA DE IMPRESSÃO - CONFIGURAÇÃO 4 COLUNAS */
        #print-area {
            background: white;
            width: 195mm; /* Largura quase total do A4 Retrato */
            display: grid;
            grid-template-columns: repeat(4, 46mm); /* 4 colunas fixas */
            gap: 1.5mm;
            padding: 3mm;
            justify-content: center;
        }

        .etiqueta {
            width: 46mm;
            height: 38mm;
            border: 0.4pt solid #444;
            padding: 4pt;
            box-sizing: border-box;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            page-break-inside: avoid;
        }

        .logo-header {
            width: 100%;
            height: 8mm;
            display: flex;
            justify-content: center;
            border-bottom: 0.5pt solid #eee;
        }
        .logo-header img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .prod-title {
            text-align: center;
            font-size: 9pt;
            font-weight: 800;
            margin: 2pt 0;
            color: #000;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
        }

        .info-lines { font-size: 6.5pt; font-weight: 700; line-height: 1.4; }
        .line { border-bottom: 0.3pt solid #ddd; display: flex; justify-content: space-between; }
        .val-text { font-weight: 400; color: #333; }

        .footer-note {
            font-size: 5.5pt;
            text-align: center;
            background: var(--light-blue);
            padding: 1px;
            border-radius: 3px;
            font-style: italic;
        }

        .scroll-wrapper { width: 100%; overflow-x: auto; background: #333; padding: 15px; margin-top: 10px; border-radius: 12px; }
        .preview-label { margin-top: 20px; font-size: 0.75rem; font-weight: bold; }

        footer-dev { margin-top: 15px; font-size: 0.65rem; opacity: 0.5; }

        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

    <div class="app-container no-print">
        <header>
            <h1>Joyce v.2</h1>
            <p style="font-size: 0.8rem; opacity: 0.7;">Gerador de Etiquetas para acessorios Hospitalares</p>
        </header>

        <div class="input-group">
            <label>Produto</label>
            <select id="produto" onchange="gerarPreview()">
                <option value="Álcool 70%">Álcool 70%</option>
                <option value="Aromatizante" selected>Aromatizante</option>
                <option value="Desinfetante">Desinfetante</option>
                <option value="Detergente">Detergente</option>
                <option value="Sabão Líquido">Sabão Líquido</option>
            </select>
        </div>

        <div class="input-group">
            <label>Quantidade (Total de Etiquetas)</label>
            <input type="number" id="qtd" value="12" min="1" oninput="gerarPreview()">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="input-group">
                <label>Data Abertura</label>
                <input type="date" id="dataAbertura" onchange="gerarPreview()">
            </div>
            <div class="input-group">
                <label>Executor</label>
                <input type="text" id="executor" placeholder="Nome" onkeyup="gerarPreview()">
            </div>
        </div>

        <button onclick="baixarPDF()">GERAR PDF</button>
    </div>

    <div class="preview-label no-print">PRÉ-VISUALIZAÇÃO DA FOLHA</div>

    <div class="scroll-wrapper no-print">
        <div id="print-area"></div>
    </div>

    <footer-dev class="no-print">Setor de Tecnologia da Informação (T.I.) — Instituto Impar</footer-dev>

    <script>
        const BANNER_LOGOS = "https://i.imgur.com/U3RKJBW.png";
        document.getElementById('dataAbertura').valueAsDate = new Date();

        function gerarPreview() {
            const container = document.getElementById('print-area');
            container.innerHTML = '';

            const produto = document.getElementById('produto').value;
            const qtd = parseInt(document.getElementById('qtd').value) || 0;
            const executor = document.getElementById('executor').value || "________";
            const dataInput = document.getElementById('dataAbertura').value;

            let dataAb = "__/__/____";
            let dataVal = "__/__/____";

            if (dataInput) {
                const dt = new Date(dataInput + 'T12:00:00');
                dataAb = dt.toLocaleDateString('pt-BR');
                dt.setDate(dt.getDate() + 30);
                dataVal = dt.toLocaleDateString('pt-BR');
            }

            for (let i = 0; i < qtd; i++) {
                const etiq = document.createElement('div');
                etiq.className = 'etiqueta';

                etiq.innerHTML = `
                    <div class="logo-header">
                        <img src="${BANNER_LOGOS}" alt="Logos">
                    </div>
                    <div class="prod-title">${produto}</div>
                    <div class="info-lines">
                        <div class="line"><span>ABERTURA:</span> <span class="val-text">${dataAb}</span></div>
                        <div class="line"><span>VALIDADE:</span> <span class="val-text">${dataVal}</span></div>
                        <div class="line"><span>EXECUTOR:</span> <span class="val-text">${executor}</span></div>
                    </div>
                    <div class="footer-note">Validade: 30 dias após aberto.</div>
                `;
                container.appendChild(etiq);
            }
        }

        function baixarPDF() {
            const element = document.getElementById('print-area');
            const opt = {
                margin: [2, 2, 2, 2], // Margens mínimas (topo, esquerda, baixo, direita) em mm
                filename: 'etiquetas_4_colunas.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all'] }
            };

            html2pdf().set(opt).from(element).save();
        }

        gerarPreview();
    </script>

</body>
</html>
