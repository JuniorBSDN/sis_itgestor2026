<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Etiquetas HMRV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0056b3;
            --light-blue: #e7f1ff;
            --bg: #f4f7f6;
            --text: #2c3e50;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container Principal */
        .app-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.4rem; color: var(--primary-blue); margin: 0; }
        header p { font-size: 0.85rem; opacity: 0.7; }

        /* Formulário */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 5px; color: #666; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--primary-blue); outline: none; }

        button {
            width: 100%;
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(0,86,179,0.3);
        }

        /* Preview Area */
        .preview-label { margin-top: 25px; font-size: 0.8rem; font-weight: bold; text-align: center; }
        .scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            background: #ddd;
            padding: 20px 0;
            margin-top: 10px;
            border-radius: 12px;
        }

        /* Configuração da Grade para o PDF */
        #print-area {
            display: grid;
            grid-template-columns: repeat(4, 65mm); /* 4 Colunas */
            gap: 2mm;
            width: fit-content;
            margin: 0 auto;
            background: white;
            padding: 5mm;
        }

        /* Design da Etiqueta */
        .etiqueta {
            width: 65mm;
            height: 48mm;
            border: 1px solid #333;
            padding: 5pt;
            box-sizing: border-box;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo-header {
            width: 100%;
            height: 12mm;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #eee;
            margin-bottom: 4px;
        }
        .logo-header img { width: 100%; height: 100%; object-fit: contain; }

        .prod-title {
            text-align: center;
            font-size: 12pt;
            font-weight: 800;
            margin: 2pt 0;
            color: #000;
            text-transform: uppercase;
        }

        .info-lines { font-size: 8pt; font-weight: 700; line-height: 1.5; }
        .line { border-bottom: 0.5pt solid #ccc; display: flex; justify-content: space-between; }
        .val-text { font-weight: 400; color: #333; }

        .footer-note {
            font-size: 6pt;
            text-align: center;
            margin-top: 4px;
            background: var(--light-blue);
            padding: 2px;
            border-radius: 4px;
            font-style: italic;
        }

        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

    <div class="app-container no-print">
        <header>
            <h1>Joyce v.2</h1>
            <p>Gerador de etiquetas - HMRV</p>
        </header>

        <div class="input-group">
            <label>Produto</label>
            <select id="produto" onchange="gerarPreview()">
                <option value="Álcool 70%">Álcool 70%</option>
                <option value="Aromatizante" selected>Aromatizante</option>
                <option value="Desinfetante">Desinfetante</option>
                <option value="Detergente">Detergente</option>
                <option value="Sabão Líquido">Sabão Líquido</option>
            </select>
        </div>

        <div class="input-group">
            <label>Quantidade de Etiquetas</label>
            <input type="number" id="qtd" value="8" min="1" oninput="gerarPreview()">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="input-group">
                <label>Data Abertura</label>
                <input type="date" id="dataAbertura" onchange="gerarPreview()">
            </div>
            <div class="input-group">
                <label>Executor</label>
                <input type="text" id="executor" placeholder="Nome" onkeyup="gerarPreview()">
            </div>
        </div>

        <button onclick="baixarPDF()">BAIXAR PDF PARA IMPRESSÃO</button>
    </div>

    <div class="preview-label no-print">PRÉ-VISUALIZAÇÃO (ARRASTE PARA O LADO)</div>

    <div class="scroll-wrapper no-print">
        <div id="print-area">
            </div>
    </div>

    <script>
        // Imagem em Base64 para garantir que apareça no PDF offline
        const BANNER_LOGOS = "https://i.imgur.com/U3RKJBW.png";

        // Setar data de hoje
        document.getElementById('dataAbertura').valueAsDate = new Date();

        function gerarPreview() {
            const container = document.getElementById('print-area');
            container.innerHTML = ''; // Limpa

            const produto = document.getElementById('produto').value;
            const qtd = parseInt(document.getElementById('qtd').value) || 0;
            const executor = document.getElementById('executor').value || "________";
            const dataInput = document.getElementById('dataAbertura').value;

            let dataAb = "__/__/____";
            let dataVal = "__/__/____";

            if (dataInput) {
                const dt = new Date(dataInput + 'T12:00:00');
                dataAb = dt.toLocaleDateString('pt-BR');
                dt.setDate(dt.getDate() + 30);
                dataVal = dt.toLocaleDateString('pt-BR');
            }

            for (let i = 0; i < qtd; i++) {
                const etiq = document.createElement('div');
                etiq.className = 'etiqueta';
                etiq.innerHTML = `
                    <div class="logo-header">
                        <img src="${BANNER_LOGOS}" alt="Logos">
                    </div>
                    <div class="prod-title">${produto}</div>
                    <div class="info-lines">
                        <div class="line"><span>ABERTURA:</span> <span class="val-text">${dataAb}</span></div>
                        <div class="line"><span>VALIDADE:</span> <span class="val-text">${dataVal}</span></div>
                        <div class="line"><span>EXECUTOR:</span> <span class="val-text">${executor}</span></div>
                    </div>
                    <div class="footer-note">Validade de 30 dias após abertura.</div>
                `;
                container.appendChild(etiq);
            }
        }

        function baixarPDF() {
            const element = document.getElementById('print-area');
            const opt = {
                margin: 5,
                filename: 'etiquetas_HMRV.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 3, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // Inicia a primeira visualização
        gerarPreview();
    </script>
<p>Desenvolvido pelo setor de T.i - instituto impar</p>
</body>
</html>
