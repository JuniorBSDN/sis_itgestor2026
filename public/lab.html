<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmyBIO v.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg: #0f172a;
                --card: #1e293b;
                --primary: #38bdf8;
                --text: #f1f5f9;
                --accent: #22c55e;
                --danger: #ef4444; }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 15px; }

        .app-container { display: grid; grid-template-columns: 280px 1fr; gap: 20px; max-width: 1200px; margin: auto; }

        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }

        h1 { color: var(--primary); text-align: center; font-size: 1.2rem; margin-bottom: 20px; }

        .nav-btn { width: 100%; padding: 10px; margin-bottom: 6px; background: #334155; color: white; border: none; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.9rem; }

        .nav-btn.active { background: var(--primary); color: #0f172a; font-weight: bold; }

        .exam-section { display: none; }

        .exam-section.active { display: block; }

        .exam-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; margin-bottom: 8px; align-items: center; }

        input, textarea { background: #0f172a; border: 1px solid #475569; color: white; padding: 6px; border-radius: 4px; width: 100%; box-sizing: border-box; }

        .ref-text { font-size: 0.70rem; color: #94a3b8; }

        .btn-action { width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; color: white; }

        .group-header { font-weight: bold; color: var(--primary); padding: 10px 0 5px 0; border-bottom: 1px solid #334155; margin-top: 15px; font-size: 0.9rem; }

/* Ajustes para Mobile */
@media (max-width: 768px) {
    .app-container {
        grid-template-columns: 1fr; /* Coluna única no celular */
        padding: 5px;
    }

    .exam-row {
        grid-template-columns: 1fr; /* Empilha os campos (Label, Input, Ref) */
        gap: 5px;
        margin-bottom: 15px;
    }

    .ref-text {
        font-size: 0.8rem;
        color: var(--primary); /* Destaque melhor no mobile */
    }

    /* Melhora a área de toque dos botões */
    .btn-action {
        padding: 15px;
        font-size: 1rem;
    }

    body { padding: 10px; }
}
    </style>
</head>
<body>

<div class="app-container">
    <div class="side-panel">
        <h1>EmyBIO v.1</h1>
        <div id="nav-container"></div>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
        <button class="btn-action" style="background:var(--accent)" onclick="gerarTodosExames()">GERAR LAUDOS SEPARADOS</button>
        <button class="btn-action" style="background:#6366f1" onclick="gerarLaudoConsolidado()">GERAR LAUDO UNIFICADO </button>
        <button class="btn-action" style="background:var(--danger)" onclick="limparTudo()">NOVO ATENDIMENTO</button>
        <br>
        <p>ATENÇÃO! Para Suporte imediato, entre em contato com setor de técnologia da informação - T.I pelo numero (91)98325-2639 </p>
    </div>

    <div class="form-area">
        <div class="card">
            <h2>Identificação do Paciente</h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="text" id="p_nome" placeholder="Nome do Paciente" oninput="save()">
                <input type="text" id="p_idade" placeholder="Idade" oninput="save()">
                <input type="date" id="p_data" oninput="save()">
                <input type="text" id="p_hora" placeholder="Hora" oninput="save()">
                <input type="text" id="p_prot" placeholder="Protocolo" oninput="save()">
                <input type="text" id="p_atend" placeholder="Atendimento" oninput="save()">
                <div style="grid-column: span 2;">
                    <input type="text" id="p_plantonista" placeholder="Responsável Plantonista (Nome e Categoria)" oninput="save()">
                </div>
            </div>
        </div>
        <div id="sections-container"></div>
    </div>
</div>

    function adicionarResultado(doc, label, valor, unidade, referencia, y) {
        doc.setFont("helvetica", "normal");
        doc.text(label, 20, y);
        doc.setFont("helvetica", "bold");
        doc.text(valor + " " + unidade, 90, y); // Adiciona a unidade ao lado do valor
        doc.setFont("helvetica", "italic");
        doc.setFontSize(8);
        doc.text("Ref: " + referencia, 140, y); // Adiciona o valor de referência
        doc.setFontSize(10);
    }

    const navCont = document.getElementById('nav-container');
    const secCont = document.getElementById('sections-container');

    configs.forEach(s => {
        navCont.innerHTML += `<button class="nav-btn" id="btn_${s.id}" onclick="show('${s.id}')">${s.title}</button>`;
        let html = `<div class="card exam-section" id="sec_${s.id}"><h2>${s.title}</h2>`;
        let lastGroup = '';
        s.fields.forEach(f => {
            if (f.g !== lastGroup) { html += `<div class="group-header">${f.g}</div>`; lastGroup = f.g; }
            html += `<div class="exam-row"><span>${f.n}</span><input type="text" id="${s.id}_${f.n}" oninput="save()"><span class="ref-text">${f.r} ${f.u}</span></div>`;

        html += `<label style="margin-top:10px; display:block">Observação:</label><textarea id="obs_${s.id}" rows="2" oninput="save()"></textarea>`;

    function show(id) {
        document.querySelectorAll('.exam-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec_'+id).classList.add('active');
        document.getElementById('btn_'+id).classList.add('active');
    }

    function save() { document.querySelectorAll('input, textarea').forEach(e => localStorage.setItem(e.id, e.value)); }

    window.onload = () => {
    // Preenche os inputs com o que está salvo (Nome, Idade, etc)
    document.querySelectorAll('input, textarea').forEach(e => e.value = localStorage.getItem(e.id) || '');

    // Atualiza a DATA sempre para o dia atual

    if (dataInput) {

    }

    if (horaInput) {

        horaInput.value = agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
    }

    // Salva automaticamente a nova hora e data no localStorage
    save();

    if (f.r) {
        y += 4; // Pequeno salto para a linha da referência
        doc.setFont("helvetica", "italic");
        doc.setFontSize(7);
        doc.setTextColor(100); // Tom de cinza para não poluir
        const refTexto = f.u ? `Ref: ${f.r} ${f.u}` : `Ref: ${f.r}`;
        doc.text(refTexto, x + 45, y);
        doc.setTextColor(0); // Volta para o preto
        y += 3; // Ajuste para a próxima linha de exame
    } else {
        y += 6; // Espaçamento normal se não houver referência
    }
});
    y += 4;
}

    await montarRodape(doc);
    doc.save(`Laudo_Consolidado_${nome}.pdf`);
}

async function gerarPDFIndividual(secaoId) {
    const doc = new jsPDF();
    const s = configs.find(c => c.id === secaoId);
    let y = 50;

    doc.setFontSize(16); doc.text(s.title, 105, 20, {align:'center'});
    doc.setFontSize(10);
    doc.text(`Paciente: ${document.getElementById('p_nome').value}`, 20, 35);
    doc.line(20, 40, 190, 40);

    s.fields.forEach(f => {
        const val = document.getElementById(`${s.id}_${f.n}`).value;
        if(val) {
            doc.text(f.n, 20, y);
            doc.setFont("helvetica", "bold");
            doc.text(val, 80, y);
            doc.setFont("helvetica", "normal");
            doc.text(`${f.r} ${f.u}`, 140, y);
            y += 8;
        }
    });

    await montarRodape(doc);
    doc.save(`Laudo_${s.title}.pdf`);
}

function gerarPDFIndividual(id) {
    const doc = new jsPDF();
    const exame = configs.find(c => c.id === id);
    let pY = 60; // Começa abaixo do cabeçalho

    // Titulo do Exame
    doc.setFontSize(14);
    doc.setFont("helvetica", "bold");
    doc.text(exame.title, 105, 50, { align: 'center' });
    doc.setFontSize(10);


    // PROVAVELMENTE AQUI SÃO INSERIDOS TMBM AS UNIDADES DE MEDIDAS DESTE SEÇÃO
    // Percorre os campos do exame e usa a sua função 'adicionarResultado'
    exame.fields.forEach(f => {
        const valor = document.getElementById(`${id}_${f.n}`).value || "---";

        // Chamando a sua função aqui:
        adicionarResultado(doc, f.n, valor, f.u, f.r, pY);

        pY += 8; // Pula para a próxima linha
    });

    // Adiciona observações se houver
    const obs = document.getElementById(`obs_${id}`).value;
    if (obs) {
        pY += 5;
        doc.setFont("helvetica", "italic");
        doc.text("Obs: " + obs, 20, pY);
    }

    doc.save(`Laudo_${exame.title}.pdf`);
}

    function gerarPDFIndividual(sectionId) {
        const s = configs.find(c => c.id === sectionId);
        const doc = new jsPDF();
        montarCabecalho(doc);

        let y = 60;
        doc.setFont("helvetica", "bold"); doc.setFontSize(14);
        doc.text(s.title, 15, y); y += 10;

        let lastGroup = '';
        s.fields.forEach(f => {
            const val = document.getElementById(`${s.id}_${f.n}`).value;
            if(val) {
                if (f.g !== lastGroup) {
                    doc.setFontSize(9); doc.setFont("helvetica", "bold");
                    doc.text(f.g, 20, y); y += 6;
                    lastGroup = f.g;
                }
                doc.setFontSize(10); doc.setFont("helvetica", "normal");
                // Aqui incluímos o valor + unidade
                doc.text(`${f.n}: ${val} ${f.u}`, 25, y);
                // Aqui incluímos o intervalo de referência + unidade
                doc.text(`Ref: ${f.r} ${f.u}`, 140, y);
                y += 6;
            }
        });

        const obs = document.getElementById(`obs_${s.id}`).value;
        if(obs) { doc.text(`Obs: ${obs}`, 25, y+5); }

        montarRodape(doc);
        doc.save(`Laudo_${s.title}_${document.getElementById('p_nome').value || 'Paciente'}.pdf`);
    }

    function gerarTodosExames() {
    // Filtra apenas os exames que têm conteúdo
    const examesComDados = configs.filter(s =>
        s.fields.some(f => document.getElementById(`${s.id}_${f.n}`)?.value !== "")
    );

    let i = 0;

    // Cria um atraso de 500ms (meio segundo) entre cada download
    const intervalo = setInterval(() => {
        if (i < examesComDados.length) {
            gerarPDFIndividual(examesComDados[i].id);
            i++;
        } else {
            clearInterval(intervalo);
        }
    }, 500);
}
