<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>HMV - Sistema de Laudos (Profissional)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #38bdf8; --text: #f1f5f9; --accent: #22c55e; --danger: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
        .app-container { display: grid; grid-template-columns: 280px 1fr; gap: 20px; max-width: 1200px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        h1 { color: var(--primary); text-align: center; font-size: 1.2rem; margin-bottom: 20px; }
        .nav-btn { width: 100%; padding: 10px; margin-bottom: 6px; background: #334155; color: white; border: none; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.9rem; }
        .nav-btn.active { background: var(--primary); color: #0f172a; font-weight: bold; }
        .exam-section { display: none; }
        .exam-section.active { display: block; }
        .exam-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; margin-bottom: 8px; align-items: center; }
        input, textarea { background: #0f172a; border: 1px solid #475569; color: white; padding: 6px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .ref-text { font-size: 0.70rem; color: #94a3b8; }
        .btn-action { width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; color: white; }
        .group-header { font-weight: bold; color: var(--primary); padding: 10px 0 5px 0; border-bottom: 1px solid #334155; margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="side-panel">
        <h1>HMV - LAB</h1>
        <div id="nav-container"></div>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
        <button class="btn-action" style="background:var(--accent)" onclick="gerarTodosExames()">GERAR TODOS OS LAUDOS</button>
        <button class="btn-action" style="background:var(--danger)" onclick="limparTudo()">NOVO ATENDIMENTO</button>
    </div>

    <div class="form-area">
        <div class="card">
            <h2>Identificação do Paciente</h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="text" id="p_nome" placeholder="Nome do Paciente" oninput="save()">
                <input type="text" id="p_idade" placeholder="Idade" oninput="save()">
                <input type="date" id="p_data" oninput="save()">
                <input type="text" id="p_hora" placeholder="Hora" oninput="save()">
                <input type="text" id="p_prot" placeholder="Protocolo" oninput="save()">
                <input type="text" id="p_atend" placeholder="Atendimento" oninput="save()">
                <div style="grid-column: span 2;">
                    <input type="text" id="p_plantonista" placeholder="Responsável Plantonista (Nome e Categoria)" oninput="save()">
                </div>
            </div>
        </div>
        <div id="sections-container"></div>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;

    const configs = [
        { title: 'HEMOGRAMA', id: 'hemo', fields: [
            {n:'Hemácias', r:'3.5-6.0', u:'10^6/uL', g:'ERITROGRAMA'},
            {n:'Hemoglobina', r:'11-17.5', u:'g/dL', g:'ERITROGRAMA'},
            {n:'Hematócrito', r:'35-54', u:'%', g:'ERITROGRAMA'},
            {n:'VCM', r:'80-100', u:'fL', g:'ERITROGRAMA'},
            {n:'HCM', r:'26-34', u:'pg', g:'ERITROGRAMA'},
            {n:'CHCM', r:'31-36', u:'g/dL', g:'ERITROGRAMA'},
            {n:'RDW', r:'11-16', u:'%', g:'ERITROGRAMA'},
            {n:'Leucócitos', r:'3.5-10', u:'10^3/uL', g:'LEUCOGRAMA'},
            {n:'Bastões', r:'1-5', u:'%', g:'LEUCOGRAMA'},
            {n:'Segmentados', r:'50-60', u:'%', g:'LEUCOGRAMA'},
            {n:'Eosinófilos', r:'1-4', u:'%', g:'LEUCOGRAMA'},
            {n:'Linfócitos', r:'20-40', u:'%', g:'LEUCOGRAMA'},
            {n:'Monócitos', r:'2-8', u:'%', g:'LEUCOGRAMA'},
            {n:'Plaquetas', r:'150-350', u:'10^3/uL', g:'PLAQUETOGRAMA'},
            {n:'VPM', r:'6.5-12', u:'fL', g:'PLAQUETOGRAMA'},
            {n:'PDW', r:'9-17', u:'%', g:'PLAQUETOGRAMA'},
            {n:'PCT', r:'0.10-0.28', u:'%', g:'PLAQUETOGRAMA'}
]},
        { title: 'COAGULOGRAMA', id: 'coag', fields: [
            {n:'Tempo de Sagria:', r:'', u:'', g:'COAGULAÇÃO'},
            {n:'Prova do laço', r:'', u:'', g:'COAGULAÇÃO'},
            {n:'Tempo de coagulação', r:'', u:'', g:'COAGULAÇÃO'},
            {n:'Cont. de Plaquetas', r:'', u:'', g:'COAGULAÇÃO'}
        ]},
        { title: 'BIOQUÍMICA', id: 'bio', fields: [
            {n:'Glicose', r:'80-99', u:'mg/dL', g:'METABOLISMO'},
            {n:'Ureia', r:'15-40', u:'mg/dL', g:'METABOLISMO'},
            {n:'Creatinina', r:'0.5-1.6', u:'mg/dL', g:'METABOLISMO'},
            {n:'Ácido Úrico', r:'2.4-7.0', u:'mg/dL', g:'METABOLISMO'},

            {n:'Colesterol Total', r:'<= 200', u:'mg/dL', g:'LIPIDOGRAMA'},
            {n:'Colesterol HDL', r:'>= 60', u:'mg/dL', g:'LIPIDOGRAMA'},
            {n:'Triglicerídeos', r:'<= 150', u:'mg/dL', g:'LIPIDOGRAMA'},

            {n:'TGO', r:'10-37', u:'U/L', g:'ENZIMAS'},
            {n:'TGP', r:'10-39', u:'U/L', g:'ENZIMAS'},
            {n:'Bilirrubina Total', r:'0.2-1.0', u:'mg/dL', g:'ENZIMAS'},
            {n:'Bilirrubina Direta', r:'0.0-0.3', u:'mg/dL', g:'ENZIMAS'},
            {n:'GGT', r:'5-55', u:'U/L', g:'ENZIMAS'},
            {n:'Fosfatase Alcalina', r:'44-147', u:'U/L', g:'ENZIMAS'},
            {n:'Amilase', r:'25-125', u:'U/L', g:'ENZIMAS'},
            {n:'Lipase', r:'7-60', u:'U/L', g:'ENZIMAS'},
            {n:'Proteínas Totais', r:'6.0-8.3', u:'g/dL', g:'ENZIMAS'},
            {n:'CKMB', r:'<= 25', u:'U/L', g:'ENZIMAS'},
        ]},
        { title: 'IMUNOLOGIA', id: 'imuno', fields: [
            {n:'Proteína C Reativa', r:'<= 6', u:'mg/L', g:'IMUNOLOGIA'},
            {n:'Anti-Estreptolisina', r:'<= 200', u:'UI/mL', g:'IMUNOLOGIA'},
            {n:'Fator Reumatoide', r:'<= 8', u:'UI/mL', g:'IMUNOLOGIA'},
            {n:'HIV', r:'Não Reagente', u:'', g:'SOROLOGIA'},
            {n:'VDRL', r:'Não Reagente', u:'', g:'SOROLOGIA'},
            {n:'HBsAg', r:'Não Reagente', u:'', g:'SOROLOGIA'},
            {n:'HCV', r:'Não Reagente', u:'', g:'SOROLOGIA'},
            {n:'Beta HCG', r:'Negativo', u:'', g:'HORMONAL'},
            {n:'Toxoplasmose IgG', r:'Negativo', u:'', g:'SOROLOGIA'},
            {n:'Rubéola IgG', r:'Negativo', u:'', g:'SOROLOGIA'},
            {n:'Citomegalovírus IgM', r:'Negativo', u:'', g:'SOROLOGIA'},
            {n:'Teste Sífilis', r:'Negativo', u:'', g:'SOROLOGIA'},
            {n:'Teste DENGUE', r:'Negativo', u:'', g:'SOROLOGIA'},
            {n:'Teste COVID 19', r:'Negativo', u:'', g:'SOROLOGIA'},
            {n:'Sistema ABO', r:'Negativo', u:'', g:'SOROLOGIA'},
            {n:'VHS(1Hs)', r:'Negativo', u:'', g:'SOROLOGIA'},
            {n:'Troponina', r:'Negativo', u:'', g:'SOROLOGIA'},
        ]},
        { title: 'B.A.A.R.', id: 'baar', fields: [
            {n:'Amostra', r:'', u:'', g:'PESQUISA'},
            {n:'resultado(1ª):', r:'', u:'', g:'PESQUISA'},
            {n:'resultado(2ª):', r:'', u:'', g:'PESQUISA'}
        ]},
        { title: 'URINÁLISE', id: 'uri', fields: [
            {n:'Cor', r:'Amarelo', u:'', g:'CARACTERÍSTICAS FÍSICAS'},
            {n:'Aspecto', r:'Límpido', u:'', g:'CARACTERÍSTICAS FÍSICAS'},
            {n:'pH', r:'5.0-7.0', u:'', g:'CARACTERÍSTICAS FÍSICAS'},
            {n:'Densidade', r:'1.010-1.025', u:'g/mL', g:'CARACTERÍSTICAS FÍSICAS'},
            {n:'Proteína', r:'Negativo', u:'', g:'CARACTERÍSTICAS QUÍMICAS'},
            {n:'Cetona', r:'Negativo', u:'', g:'CARACTERÍSTICAS QUÍMICAS'},
            {n:'Bilirubina', r:'Negativo', u:'', g:'CARACTERÍSTICAS QUÍMICAS'},
            {n:'Urobilinogênio', r:'Negativo', u:'', g:'CARACTERÍSTICAS QUÍMICAS'},
            {n:'Glicose', r:'Negativo', u:'', g:'CARACTERÍSTICAS QUÍMICAS'},
            {n:'Nitrito', r:'Negativo', u:'', g:'CARACTERÍSTICAS QUÍMICAS'},
            {n:'Hemoglobina', r:'Negativo', u:'', g:'CARACTERÍSTICAS QUÍMICAS'},
            {n:'Leucócitos', r:'Negativo', u:'', g:'CARACTERÍSTICAS QUÍMICAS'},
            {n:'Células', r:'-', u:'/campo', g:'SEDIMENTOSCOPIA'},
            {n:'Piócitos', r:'-', u:'/campo', g:'SEDIMENTOSCOPIA'},
            {n:'Hemácias', r:'-', u:'/campo', g:'SEDIMENTOSCOPIA'},
            {n:'Cilindros', r:'-', u:'/campo', g:'SEDIMENTOSCOPIA'},
            {n:'Bactérias', r:'-', u:'/campo', g:'SEDIMENTOSCOPIA'},
            {n:'Leveduras', r:'-', u:'/campo', g:'SEDIMENTOSCOPIA'},
            {n:'Cristais', r:'-', u:'/campo', g:'SEDIMENTOSCOPIA'}
        ]}
    ];

    const navCont = document.getElementById('nav-container');
    const secCont = document.getElementById('sections-container');

    configs.forEach(s => {
        navCont.innerHTML += `<button class="nav-btn" id="btn_${s.id}" onclick="show('${s.id}')">${s.title}</button>`;
        let html = `<div class="card exam-section" id="sec_${s.id}"><h2>${s.title}</h2>`;
        let lastGroup = '';
        s.fields.forEach(f => {
            if (f.g !== lastGroup) { html += `<div class="group-header">${f.g}</div>`; lastGroup = f.g; }
            html += `<div class="exam-row"><span>${f.n}</span><input type="text" id="${s.id}_${f.n}" oninput="save()"><span class="ref-text">${f.r} ${f.u}</span></div>`;
        });
        html += `<label style="margin-top:10px; display:block">Observação:</label><textarea id="obs_${s.id}" rows="2" oninput="save()"></textarea>`;
        html += `<button class="btn-action" style="background:#475569" onclick="gerarPDFIndividual('${s.id}')">Gerar ${s.title} (PDF)</button>`;
        secCont.innerHTML += html;
    });

    function show(id) {
        document.querySelectorAll('.exam-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec_'+id).classList.add('active');
        document.getElementById('btn_'+id).classList.add('active');
    }
    show(configs[0].id);

    function save() { document.querySelectorAll('input, textarea').forEach(e => localStorage.setItem(e.id, e.value)); }

    window.onload = () => {
        document.querySelectorAll('input, textarea').forEach(e => e.value = localStorage.getItem(e.id) || '');
        const dataInput = document.getElementById('p_data');
        if (dataInput && !dataInput.value) { dataInput.value = new Date().toISOString().split('T')[0]; }
        const horaInput = document.getElementById('p_hora');
        if (horaInput && !horaInput.value) {
            const now = new Date();
            horaInput.value = now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        }
    };

    function limparTudo() { if(confirm("Limpar dados?")) { localStorage.clear(); location.reload(); } }

    // --- FUNÇÕES PDF PROFISSIONAL ---

    function montarCabecalho(doc) {
        const centroX = 105;
        const margemEsquerda = 15;
        const margemDireita = 195;

        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.text("HOSPITAL MUNICIPAL RAIMUNDO VASCONCELOS", centroX, 15, {align: 'center'});
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text("LABORATÓRIO DE ANÁLISES CLÍNICAS", centroX, 20, {align: 'center'});
        doc.setFontSize(8);
        doc.text("CNPJ: 11.672.396/0001-30 | CNES: 2314002", centroX, 25, {align: 'center'});
        doc.text("End: Av Barão do Guajará, s/n | Castanheira, VIGIA - PA", centroX, 29, {align: 'center'});
        doc.line(margemEsquerda, 32, margemDireita, 32);

        const dados = {
            paciente: document.getElementById('p_nome')?.value || 'N/A',
            idade: document.getElementById('p_idade')?.value || 'N/A',
            data: document.getElementById('p_data')?.value || 'N/A',
            hora: document.getElementById('p_hora')?.value || 'N/A',
            protocolo: document.getElementById('p_prot')?.value || 'N/A',
            plantonista: document.getElementById('p_plantonista')?.value || 'N/A'
        };

        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text(`Paciente: ${dados.paciente}`, margemEsquerda, 40);
        doc.text(`Idade: ${dados.idade}`, 150, 40);
        doc.setFont("helvetica", "normal");
        doc.text(`Data: ${dados.data} | Hora: ${dados.hora}`, margemEsquerda, 46);
        doc.text(`Protocolo: ${dados.protocolo}`, 140, 46);
        doc.text(`Plantonista: ${dados.plantonista}`, margemEsquerda, 52);
        doc.line(margemEsquerda, 55, margemDireita, 55);
    }

    // Substitua o seu montarRodape por este:
async function montarRodape(doc) {
    doc.setFontSize(12);
    doc.setFont("helvetica", "normal");

    // Linha do Plantonista
    doc.line(30, 260, 90, 260);
    doc.text(document.getElementById('p_plantonista').value || "Resp. Plantonista", 60, 266, {align: 'center'});

    // ASSINATURA: Use o código Base64 aqui
    const imgData = 'https://i.imgur.com/ztukv2M_d.jpeg?maxwidth=520&shape=thumb&fidelity=high';

    // Adiciona a imagem (formato, x, y, largura, altura)
    // O PDF aceita 'JPEG' ou 'PNG' dependendo da sua imagem
    doc.addImage(imgData, 'JPEG', 125, 230, 40, 25);

}

    function gerarPDFIndividual(sectionId) {
        const s = configs.find(c => c.id === sectionId);
        const doc = new jsPDF();
        montarCabecalho(doc);

        let y = 60;
        doc.setFont("helvetica", "bold"); doc.setFontSize(14);
        doc.text(s.title, 15, y); y += 10;

        let lastGroup = '';
        s.fields.forEach(f => {
            const val = document.getElementById(`${s.id}_${f.n}`).value;
            if(val) {
                if (f.g !== lastGroup) {
                    doc.setFontSize(9); doc.setFont("helvetica", "bold");
                    doc.text(f.g, 20, y); y += 6;
                    lastGroup = f.g;
                }
                doc.setFontSize(10); doc.setFont("helvetica", "normal");
                // Aqui incluímos o valor + unidade
                doc.text(`${f.n}: ${val} ${f.u}`, 25, y);
                // Aqui incluímos o intervalo de referência + unidade
                doc.text(`Ref: ${f.r} ${f.u}`, 140, y);
                y += 6;
            }
        });

        const obs = document.getElementById(`obs_${s.id}`).value;
        if(obs) { doc.text(`Obs: ${obs}`, 25, y+5); }

        montarRodape(doc);
        doc.save(`Laudo_${s.title}_${document.getElementById('p_nome').value || 'Paciente'}.pdf`);
    }

    function gerarTodosExames() {
        configs.forEach(s => {
            const hasData = s.fields.some(f => document.getElementById(`${s.id}_${f.n}`).value !== "");
            if(hasData) { gerarPDFIndividual(s.id); }
        });
    }
</script>
</body>
</html>
