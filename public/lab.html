<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmyBIO v.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg: #0f172a;
                --card: #1e293b;
                --primary: #38bdf8;
                --text: #f1f5f9;
                --accent: #22c55e;
                --danger: #ef4444; }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 15px; }

        .app-container { display: grid; grid-template-columns: 280px 1fr; gap: 20px; max-width: 1200px; margin: auto; }

        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }

        h1 { color: var(--primary); text-align: center; font-size: 1.2rem; margin-bottom: 20px; }

        .nav-btn { width: 100%; padding: 10px; margin-bottom: 6px; background: #334155; color: white; border: none; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.9rem; }

        .nav-btn.active { background: var(--primary); color: #0f172a; font-weight: bold; }

        .exam-section { display: none; }

        .exam-section.active { display: block; }

        .exam-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; margin-bottom: 8px; align-items: center; }

        input, textarea { background: #0f172a; border: 1px solid #475569; color: white; padding: 6px; border-radius: 4px; width: 100%; box-sizing: border-box; }

        .ref-text { font-size: 0.70rem; color: #94a3b8; }

        .btn-action { width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; color: white; }

        .group-header { font-weight: bold; color: var(--primary); padding: 10px 0 5px 0; border-bottom: 1px solid #334155; margin-top: 15px; font-size: 0.9rem; }

/* Ajustes para Mobile */
@media (max-width: 768px) {
    .app-container {
        grid-template-columns: 1fr; /* Coluna única no celular */
        padding: 5px;
    }

    .exam-row {
        grid-template-columns: 1fr; /* Empilha os campos (Label, Input, Ref) */
        gap: 5px;
        margin-bottom: 15px;
    }

    .ref-text {
        font-size: 0.8rem;
        color: var(--primary); /* Destaque melhor no mobile */
    }

    /* Melhora a área de toque dos botões */
    .btn-action {
        padding: 15px;
        font-size: 1rem;
    }

    body { padding: 10px; }
}
    </style>
</head>

// LAUDO UNIFICADO CONSOLIDADO
async function gerarLaudoConsolidado() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // Configurações de Layout
    let y = 65; // Início após o cabeçalho
    let x = 15;
    const col2X = 110;
    const larguraCol = 85;
    const limiteY = 230; // Margem de segurança para não invadir a assinatura
    let colunaAtual = 1;

    // 1. Cabeçalho Inicial
    montarCabecalho(doc);

    for (const secao of configs) {
        // Filtra apenas campos que têm valor preenchido
        const camposComValor = secao.fields.filter(f => {
            const el = document.getElementById(`${secao.id}_${f.n}`);
            return el && el.value && el.value.trim() !== "";
        });

        if (camposComValor.length > 0) {
            // Cálculo de altura: Título (10) + campos (5 cada) + margem final (5)
            const alturaEstimada = 10 + (camposComValor.length * 5) + 5;

            // Verifica se a seção cabe na coluna/página atual
            if (y + alturaEstimada > limiteY) {
                if (colunaAtual === 1) {
                    colunaAtual = 2;
                    x = col2X;
                    y = 65;
                } else {
                    // Se estiver na segunda coluna e não couber, vai para nova página
                    await aplicarRodapeComAssinatura(doc);
                    doc.addPage();
                    montarCabecalho(doc);
                    colunaAtual = 1;
                    x = 15;
                    y = 65;
                }
            }

            // Desenha Título da Seção (Fundo cinza claro)
            doc.setFont("helvetica", "bold");
            doc.setFontSize(10);
            doc.setFillColor(240, 240, 240);
            doc.rect(x, y, larguraCol, 7, 'F');
            doc.text(secao.title.toUpperCase(), x + 2, y + 5);
            y += 10;

            // Listagem dos Exames
            doc.setFontSize(9);
            camposComValor.forEach(f => {
                const valor = document.getElementById(`${secao.id}_${f.n}`).value;

                doc.setFont("helvetica", "bold");
                doc.text(`${f.n}:`, x, y);

                doc.setFont("helvetica", "normal");
                // Ajuste de posição do valor para não sobrepor o nome do campo
                doc.text(valor, x + 35, y);

                y += 5;
            });
            y += 5; // Espaço extra após terminar uma seção
        }
    }

    // Finalização: Aplica o rodapé na última página e salva
    await aplicarRodapeComAssinatura(doc);

    const nomePac = document.getElementById('p_nome').value || "Paciente";
    doc.save(`LAUDO_CONSOLIDADO_${nomePac.toUpperCase()}.pdf`);
}

// Função do Rodapé Corrigida (conforme solicitado anteriormente)
async function aplicarRodapeComAssinatura(doc) {
    // Substitua pelo seu Base64 completo da imagem
    const imgData = 'data:image/jpeg;base64,...';

    try {
        // 1. Imagem da Assinatura
        doc.addImage(imgData, 'JPEG', 75, 235, 60, 20);

        // 2. Linha do Plantonista
        doc.setDrawColor(0);
        doc.setLineWidth(0.5);
        doc.line(60, 260, 150, 260);

        // 3. Nome do Plantonista
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        const plantonista = document.getElementById('p_plantonista').value || "Responsável Técnico";
        doc.text(plantonista.toUpperCase(), 105, 266, { align: 'center' });

        // 4. Rodapé do Sistema
        doc.setFontSize(8);
        doc.setFont("helvetica", "italic");
        doc.setTextColor(100);
        doc.text("Página gerada pelo sistema EmyBIO", 105, 285, { align: 'center' });
        doc.setTextColor(0);
    } catch (e) {
        console.error("Erro ao aplicar assinatura: ", e);
    }
}
    // --- FUNÇÕES PDF PROFISSIONAL ---

    function montarCabecalho(doc) {
        const centroX = 105;
        const margemEsquerda = 15;
        const margemDireita = 195;

        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.text("HOSPITAL MUNICIPAL RAIMUNDO VASCONCELOS", centroX, 15, {align: 'center'});
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text("LABORATÓRIO DE ANÁLISES CLÍNICAS", centroX, 20, {align: 'center'});
        doc.setFontSize(8);
        doc.text("CNPJ: 11.672.396/0001-30 | CNES: 2314002", centroX, 25, {align: 'center'});
        doc.text("End: Av Barão do Guajará, s/n | Castanheira, VIGIA - PA", centroX, 29, {align: 'center'});
        doc.line(margemEsquerda, 32, margemDireita, 32);

        const dados = {
            paciente: document.getElementById('p_nome')?.value || 'N/A',
            idade: document.getElementById('p_idade')?.value || 'N/A',
            data: document.getElementById('p_data')?.value || 'N/A',
            hora: document.getElementById('p_hora')?.value || 'N/A',
            protocolo: document.getElementById('p_prot')?.value || 'N/A',
            plantonista: document.getElementById('p_plantonista')?.value || 'N/A'
        };

        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text(`Paciente: ${dados.paciente}`, margemEsquerda, 40);
        doc.text(`Idade: ${dados.idade}`, 150, 40);
        doc.setFont("helvetica", "normal");
        doc.text(`Data: ${dados.data} | Hora: ${dados.hora}`, margemEsquerda, 46);
        doc.text(`Protocolo: ${dados.protocolo}`, 140, 46);
        doc.text(`Plantonista: ${dados.plantonista}`, margemEsquerda, 52);
        doc.line(margemEsquerda, 55, margemDireita, 55);
    }

    // Substitua o seu montarRodape por este:
async function montarRodape(doc) {
    doc.setFontSize(12);
    doc.setFont("helvetica", "normal");

    // Linha do Plantonista
    doc.line(30, 260, 90, 260);

    function gerarPDFIndividual(sectionId) {
        const s = configs.find(c => c.id === sectionId);
        const doc = new jsPDF();
        montarCabecalho(doc);

        let y = 60;
        doc.setFont("helvetica", "bold"); doc.setFontSize(14);
        doc.text(s.title, 15, y); y += 10;

        let lastGroup = '';
        s.fields.forEach(f => {
            const val = document.getElementById(`${s.id}_${f.n}`).value;
            if(val) {
                if (f.g !== lastGroup) {
                    doc.setFontSize(9); doc.setFont("helvetica", "bold");
                    doc.text(f.g, 20, y); y += 6;
                    lastGroup = f.g;
                }
                doc.setFontSize(10); doc.setFont("helvetica", "normal");
                // Aqui incluímos o valor + unidade
                doc.text(`${f.n}: ${val} ${f.u}`, 25, y);
                // Aqui incluímos o intervalo de referência + unidade
                doc.text(`Ref: ${f.r} ${f.u}`, 140, y);
                y += 6;
            }
        });

        const obs = document.getElementById(`obs_${s.id}`).value;
        if(obs) { doc.text(`Obs: ${obs}`, 25, y+5); }

        montarRodape(doc);
        doc.save(`Laudo_${s.title}_${document.getElementById('p_nome').value || 'Paciente'}.pdf`);
    }

    function gerarTodosExames() {
    // Filtra apenas os exames que têm conteúdo
    const examesComDados = configs.filter(s =>
        s.fields.some(f => document.getElementById(`${s.id}_${f.n}`)?.value !== "")
    );

    let i = 0;

    // Cria um atraso de 500ms (meio segundo) entre cada download
    const intervalo = setInterval(() => {
        if (i < examesComDados.length) {
            gerarPDFIndividual(examesComDados[i].id);
            i++;
        } else {
            clearInterval(intervalo);
        }
    }, 500);
}
