<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gestão - Hospital Seguro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
        .badge-infraestrutura { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .badge-insumos { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .badge-comportamento { background: rgba(251, 113, 133, 0.2); color: #fb7185; }
        @media print { .no-print { display: none; } body { background: white; color: black; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-6">
            <div>
                <h1 class="text-2xl font-bold">Relatos Recebidos <span id="totalCount" class="bg-blue-600 text-xs px-2 py-1 rounded-full">0</span></h1>
                <p class="text-slate-400 text-sm">Monitoramento de melhorias em tempo real</p>
            </div>
            <button onclick="atualizarLista()" id="btnRefresh" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-xl font-bold transition-all no-print">
                ATUALIZAR DADOS
            </button>
        </header>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-800/50 text-blue-400 text-xs uppercase">
                        <th class="p-4">Data/Hora</th>
                        <th class="p-4">Colaborador</th>
                        <th class="p-4">Setor</th>
                        <th class="p-4">Tipo</th>
                        <th class="p-4">Descrição</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela" class="text-sm">
                    <tr><td colspan="5" class="p-10 text-center text-slate-500 italic">Carregando relatos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Verificação de autenticação no topo do script
const auth = sessionStorage.getItem('auth_ti');
if (!auth) {
    window.location.href = 'login.html';
}
        async function atualizarLista() {
            const btn = document.getElementById('btnRefresh');
            btn.innerText = "BUSCANDO...";
            btn.disabled = true;

            try {
                // 1. Chamada para a rota correta
                const response = await fetch('/api/relatos');
                const relatos = await response.json(); // Aqui recebemos a lista direta
                
                const tbody = document.getElementById('corpoTabela');
                const countBadge = document.getElementById('totalCount');

                countBadge.innerText = relatos.length;

                if (relatos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-slate-500">Nenhum relato encontrado no banco de dados.</td></tr>`;
                    return;
                }

                // 2. Renderização (Mostra o mais recente primeiro com .reverse())
                tbody.innerHTML = relatos.reverse().map(r => `
                    <tr class="border-b border-slate-800 hover:bg-slate-800/30 transition-colors">
                        <td class="p-4 text-slate-400">${r.data_registro || 'Recém postado'}</td>
                        <td class="p-4">
                            <span class="font-bold text-white">${r.is_anonimo ? '<span class="text-slate-500 italic">Anônimo</span>' : r.nome}</span>
                            <br><small class="text-slate-500">${r.cargo || ''}</small>
                        </td>
                        <td class="p-4 text-blue-300 font-semibold">${r.setor}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-md text-[10px] font-bold uppercase badge-${(r.tipo || 'infraestrutura').toLowerCase()}">
                                ${r.tipo}
                            </span>
                        </td>
                        <td class="p-4 text-slate-300 max-w-xs">${r.descricao}</td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('corpoTabela').innerHTML = `<tr><td colspan="5" class="p-10 text-center text-red-400">Erro ao carregar dados. Verifique a conexão.</td></tr>`;
            } finally {
                btn.innerText = "ATUALIZAR DADOS";
                btn.disabled = false;
            }
        }

        // Carrega ao abrir a página
        document.addEventListener('DOMContentLoaded', atualizarLista);
    </script>
</body>
</html>
