<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gestão - Real Time</title>
    <style>
        :root {
            --primary: #38bdf8; --bg: #0f172a; --card: #1e293b;
            --text: #f1f5f9; --border: rgba(255, 255, 255, 0.1);
            --danger: #fb7185; --success: #4ade80; --warning: #fbbf24;
        }

        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 15px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
        }

        h1 { font-size: 1.2rem; margin: 0; }
        .count-badge { background: var(--primary); color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; }

        .table-wrapper {
            background: var(--card); border-radius: 16px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.03); padding: 15px; text-align: left; font-size: 0.85rem; color: var(--primary); text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: top; }

        /* Badges de Categorias */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .status-infraestrutura { background: rgba(56, 189, 248, 0.2); color: var(--primary); }
        .status-insumos { background: rgba(251, 191, 36, 0.2); color: var(--warning); }
        .status-comportamento { background: rgba(251, 113, 133, 0.2); color: var(--danger); }
        .status-processo { background: rgba(74, 222, 128, 0.2); color: var(--success); }
        .status-sugestão { background: rgba(167, 139, 250, 0.2); color: #a78bfa; }

        .refresh-btn {
            background: var(--primary); border: none; padding: 10px 20px; border-radius: 10px;
            font-weight: bold; cursor: pointer; transition: 0.3s; color: #0f172a;
        }
        .refresh-btn:hover { opacity: 0.8; }

        /* Estilos de Impressão */
        @media print {
            .refresh-btn, .no-print { display: none !important; }
            body { background: white; color: black; }
            .table-wrapper { box-shadow: none; border: 1px solid #ccc; }
            th { color: black; border-bottom: 2px solid black; }
            td { border-bottom: 1px solid #eee; color: black !important; }
            .badge { border: 1px solid #ccc; background: transparent !important; color: black !important; }
        }

        /* Mobile */
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; gap: 15px; }
            thead { display: none; }
            tr { display: block; padding: 15px; border-bottom: 5px solid var(--bg); }
            td { display: block; padding: 5px 0; text-align: right; padding-left: 50%; position: relative; }
            td::before { content: attr(data-label); position: absolute; left: 0; font-weight: bold; color: var(--primary); }
            .desc-cell { text-align: left !important; padding-left: 0 !important; margin-top: 10px; border-top: 1px solid var(--border) !important; padding-top: 10px !important; }
            .desc-cell::before { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Relatos Hospitalares <span class="count-badge" id="totalCount">0</span></h1>
            <p style="font-size: 0.8rem; opacity: 0.6; margin: 5px 0 0 0;">Painel de Monitoramento Contínuo</p>
        </div>
        <div class="flex gap-2">
            <button class="refresh-btn no-print" onclick="window.print()" style="background: #475569; color: white; margin-right: 8px;">IMPRIMIR</button>
            <button class="refresh-btn no-print" id="btnRefresh" onclick="atualizarLista()">ATUALIZAR</button>
        </div>
    </header>

    <div class="table-wrapper">
        <table id="tabelaRelatos">
            <thead>
                <tr>
                    <th style="width: 15%">Data</th>
                    <th style="width: 20%">Colaborador</th>
                    <th style="width: 15%">Setor</th>
                    <th style="width: 15%">Tipo</th>
                    <th style="width: 35%">Descrição</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <tr>
                    <td colspan="5" style="text-align:center; padding:30px;">Carregando relatos...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>



<script>
    async function atualizarLista() {
        const btn = document.getElementById('btnRefresh');
        btn.innerText = "A ATUALIZAR...";
        btn.disabled = true;

        try {
            // Rota sincronizada com o backend Python
            const response = await fetch('/api/relatos');
            const relatos = await response.json();
            
            const tbody = document.getElementById('corpoTabela');
            const countBadge = document.getElementById('totalCount');

            // Atualiza o contador
            countBadge.innerText = relatos.length;

            if (relatos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; opacity:0.5;">Nenhum relato encontrado no banco de dados.</td></tr>`;
            } else {
                // Inverter a lista para mostrar os mais recentes primeiro
                const listaInvertida = [...relatos].reverse();

                tbody.innerHTML = listaInvertida.map(r => `
                    <tr>
                        <td data-label="Data">
                            <span style="font-weight:bold;">${r.data_registro || 'S/D'}</span>
                        </td>
                        <td data-label="Colaborador">
                            <div style="font-weight:600;">${r.is_anonimo ? '<span style="color:#94a3b8">Anônimo</span>' : r.nome}</div>
                            <div style="font-size:0.7rem; opacity:0.6;">${r.cargo || ''}</div>
                        </td>
                        <td data-label="Setor"><span style="text-transform:uppercase; font-size:0.8rem;">${r.setor}</span></td>
                        <td data-label="Tipo">
                            <span class="badge status-${r.tipo.toLowerCase().replace(/ /g, '-')}">${r.tipo}</span>
                        </td>
                        <td class="desc-cell" style="line-height:1.4;">${r.descricao}</td>
                    </tr>
                `).join('');
            }
        } catch (error) {
            console.error("Erro ao carregar relatos:", error);
            document.getElementById('corpoTabela').innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--danger);">Erro ao conectar com o servidor.</td></tr>`;
        } finally {
            btn.innerText = "ATUALIZAR";
            btn.disabled = false;
        }
    }

    // Carregar automaticamente
    document.addEventListener('DOMContentLoaded', atualizarLista);
</script>

</body>
</html>
