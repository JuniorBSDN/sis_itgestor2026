<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gestão - Real Time</title>
    <style>
        :root {
            --primary: #38bdf8; --bg: #0f172a; --card: #1e293b;
            --text: #f1f5f9; --border: rgba(255, 255, 255, 0.1);
            --danger: #fb7185; --success: #4ade80; --warning: #fbbf24;
        }

        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 15px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
        }

        h1 { font-size: 1.2rem; margin: 0; }
        .count-badge { background: var(--primary); color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }

        /* Estilização da Tabela Responsiva */
        .table-wrapper {
            background: var(--card); border-radius: 16px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.03); padding: 15px; text-align: left; font-size: 0.85rem; color: var(--primary); }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

        /* Badges */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .status-infra { background: rgba(56, 189, 248, 0.2); color: var(--primary); }
        .status-insumo { background: rgba(251, 191, 36, 0.2); color: var(--warning); }
        .status-etica { background: rgba(251, 113, 133, 0.2); color: var(--danger); }

        /* RESPONSIVIDADE (Mobile) */
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; gap: 15px; }

            thead { display: none; } /* Esconde o cabeçalho da tabela */

            tr {
                display: block; padding: 15px; border-bottom: 5px solid var(--bg);
                position: relative;
            }

            td {
                display: block; padding: 5px 0; border: none; text-align: right;
                padding-left: 50%; position: relative;
            }

            td::before {
                content: attr(data-label); position: absolute; left: 0; width: 45%;
                font-weight: bold; text-align: left; color: var(--primary); font-size: 0.8rem;
            }

            .desc-cell { text-align: left !important; padding-left: 0 !important; margin-top: 10px; border-top: 1px solid var(--border) !important; padding-top: 10px !important; }
            .desc-cell::before { display: none; }
        }

        .refresh-btn {
            background: var(--primary); border: none; padding: 10px 20px; border-radius: 10px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .refresh-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Relatos Recebidos <span class="count-badge" id="totalCount">0</span></h1>
            <p style="font-size: 0.8rem; opacity: 0.6; margin: 5px 0 0 0;">Atualizado em tempo real</p>
        </div>
        <button class="refresh-btn" onclick="atualizarLista()">ATUALIZAR</button>
    </header>

    <div class="table-wrapper">
        <table id="tabelaRelatos">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Colaborador</th>
                    <th>Setor</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                </tbody>
        </table>
    </div>
</div>

<script>
   async function atualizarLista() {
    const btn = document.querySelector('.refresh-btn');
    btn.innerText = "ATUALIZANDO...";

    try {
        // Agora chamando a rota correta que você mencionou
        const response = await fetch('/api/rat_app'); 
        const data = await response.json();
        const tbody = document.getElementById('corpoTabela');
        const countBadge = document.getElementById('totalCount');

        if (data.status === "sucesso") {
            countBadge.innerText = data.relatos.length;

            if (data.relatos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; opacity:0.5;">Nenhum relato encontrado.</td></tr>`;
            } else {
                tbody.innerHTML = data.relatos.map(r => `
    <tr>
        <td>${r.data_registro}</td>
        <td>${r.is_anonimo ? 'Anônimo' : r.autor_nome}</td>
        <td>${r.setor}</td>
        <td>${r.tipo_falha}</td>
        <td>${r.descricao}</td>
    </tr>
`).join('');
            }
        }
    } catch (error) {
        console.error("Erro ao buscar relatos:", error);
        alert("Erro ao carregar dados. Verifique se o servidor está rodando.");
    } finally {
        btn.innerText = "ATUALIZAR";
    }
}
</script>

</body>
</html>
