<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | HMV</title>
    <style>
        :root { --primary: #0056b3; --success: #28a745; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .admin-box { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #login-screen { text-align: center; padding: 40px 0; }
        .login-input { padding: 12px; width: 250px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 20px; font-size: 16px; }
        #admin-screen { display: none; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; }
        th { background: var(--primary); color: white; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>
<div class="admin-box">
    <div id="login-screen">
        <h2>Acesso à Coordenação</h2>
        <input type="password" id="pass-input" class="login-input" placeholder="Senha Administrativa"><br>
        <button class="btn" style="background: var(--primary);" onclick="acessar()">Entrar</button>
    </div>

    <div id="admin-screen">
        <div class="header-admin no-print">
            <h2>Lista de Presença Digital</h2>
            <div>
                <button class="btn" style="background: var(--success);" onclick="window.print()">Imprimir</button>
                <button class="btn" style="background: #6c757d;" onclick="sair()">Sair</button>
            </div>
        </div>
        <table>
            <thead>
                <tr><th>Profissional</th><th>CPF</th><th>E-mail</th><th>Conclusão</th></tr>
            </thead>
            <tbody id="lista-corpo"></tbody>
        </table>
    </div>
</div>

<script>
    async function acessar() {
        const senha = document.getElementById('pass-input').value;
        try {
            const res = await fetch('/api/listar', {
                headers: { 'Authorization': senha.trim() }
            });
            if (res.ok) {
                const registros = await res.json();
                sessionStorage.setItem('token_hmv', senha.trim());
                exibirPainel(registros);
            } else {
                alert("Senha inválida.");
            }
        } catch (err) { alert("Erro de conexão."); }
    }

    function exibirPainel(dados) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        document.getElementById('lista-corpo').innerHTML = dados.map(r => `
            <tr><td>${r.nome}</td><td>${r.cpf}</td><td>${r.email}</td><td>${r.data_conclusao}</td></tr>
        `).join('');
    }

    function sair() { sessionStorage.removeItem('token_hmv'); location.reload(); }

    window.onload = () => {
        const token = sessionStorage.getItem('token_hmv');
        if (token) { document.getElementById('pass-input').value = token; acessar(); }
    }
</script>
</body>
</html>
