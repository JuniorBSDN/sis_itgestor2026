<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | HMV</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0056b3; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: none; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); margin-bottom: 20px; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid var(--border); text-align: left; }
        th { background: #f1f5f9; font-size: 0.8rem; color: #64748b; text-transform: uppercase; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; }
        @media print { .no-print { display: none !important; } body { display: block !important; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="color: var(--primary); margin:0;">Lista de Presença</h1>
            <small>HMV - Treinamentos Concluídos</small>
        </div>
        <div class="no-print">
            <button class="btn" style="background: #28a745;" onclick="window.print()">Imprimir</button>
            <button class="btn" style="background: #6c757d; margin-left:10px;" onclick="sair()">Sair</button>
        </div>
    </header>

    <table>
        <thead>
            <tr>
                <th>Profissional</th>
                <th>CPF</th>
                <th>E-mail</th>
                <th>Conclusão</th>
            </tr>
        </thead>
        <tbody id="lista-corpo"></tbody>
    </table>
</div>

<script>
    // CAMADA DE SEGURANÇA IGUAL AO PONTOBACK
  async function validarAcesso() {
    const senha = prompt("Chave de Acesso Administrativa:");
    if (!senha) return location.reload();

    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ senha: senha.trim() }) // Remove espaços acidentais
        });

        if (res.ok) {
            document.body.style.display = "block"; // Mostra o painel
            carregarDados(); // Chama a função que preenche a tabela
        } else {
            alert("Acesso Negado! Verifique a senha na Vercel.");
            location.reload();
        }
    } catch (e) {
        alert("Erro de conexão com o servidor.");
    }
}
    async function carregarDados() {
        try {
            const res = await fetch('/api/listar');
            const dados = await res.json();
            const corpo = document.getElementById('lista-corpo');
            corpo.innerHTML = dados.map(r => `
                <tr>
                    <td><strong>${r.nome}</strong></td>
                    <td>${r.cpf}</td>
                    <td>${r.email}</td>
                    <td>${r.data_conclusao}</td>
                </tr>
            `).join('');
        } catch (err) {
            console.error("Erro ao carregar dados");
        }
    }

    function sair() {
        location.reload();
    }

    // Inicia a validação ao carregar
    validarAcesso();
</script>

</body>
</html>
