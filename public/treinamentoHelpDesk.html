<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento HMV | Instituto Ímpar</title>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --danger: #dc3545; --bg: #f4f7f6; --text: #333; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); margin: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        header { padding: 20px; text-align: center; border-bottom: 2px solid var(--bg); }
        header img { height: 45px; }
        .content { padding: 25px; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 18px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 10px; overflow: hidden; margin: 20px 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

<div class="app-container">
    <header><img src="https://i.imgur.com/U3RKJBW.png" alt="Instituto Ímpar"></header>
    <div class="content">
        <section id="step-1" class="step active">
            <h2>Identificação</h2>
            <p>Olá Prestador! Informe seus dados para iniciar o treinamento sobre o novo Portal de HelpDesk HMV.</p>

            <input type="text" id="nome" placeholder="Nome Completo">
            <input type="tel" id="cpf" placeholder="CPF (apenas números)">
            <button onclick="irParaVideo()">Acessar Treinamento</button>
        </section>

        <section id="step-2" class="step">
            <h2>Vídeo de Treinamento</h2>
            <div class="video-container"><div id="player"></div></div>
            <p id="msg-aguarde" style="text-align: center; color: var(--danger);">Assista até o fim para liberar o certificado.</p>
        </section>

        <section id="step-3" class="step">
            <h2 style="color: var(--success);">Concluído!</h2>
            <button onclick="abrirModalFinal()">OK, EMITIR CERTIFICADO</button>
        </section>
    </div>
</div>

<div id="modalFinal" class="modal">
    <div class="modal-content">
        <h3>Onde deseja receber?</h3>
        <input type="email" id="email" placeholder="seu-email@exemplo.com">
        <button onclick="enviarDados('email', this)">Enviar por E-mail</button>
        <button onclick="enviarDados('download', this)" style="background: #6c757d; margin-top: 10px;">Baixar agora</button>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player;
    let user = { nome: '', cpf: '', email: '' };

    function irParaStep(num) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step-' + num).classList.add('active');
    }

    function irParaVideo() {
        user.nome = document.getElementById('nome').value.trim();
        user.cpf = document.getElementById('cpf').value.replace(/\D/g, '').trim();
        if(user.nome.length < 3 || user.cpf.length < 11) return alert("Preencha os dados corretamente.");
        irParaStep(2);
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '100%', width: '100%', videoId: 'ENPRg3ecejQ',
            playerVars: { 'rel': 0, 'controls': 1, 'disablekb': 1 },
            events: { 'onStateChange': (e) => { if(e.data == YT.PlayerState.ENDED) irParaStep(3); } }
        });
    }

    function abrirModalFinal() { document.getElementById('modalFinal').style.display = 'flex'; }

    async function enviarDados(acao, btn) {
        user.email = document.getElementById('email').value.trim();
        if(!user.email.includes('@')) return alert("E-mail inválido.");

        btn.disabled = true;
        btn.innerText = "Processando...";

        try {
            const res = await fetch('/api/registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...user, acao: acao })
            });

            if(res.ok) {
                if(acao === 'download') window.open(`/api/certificado_download?cpf=${user.cpf}&nome=${encodeURIComponent(user.nome)}`, '_blank');
                else alert("Certificado enviado!");
                
                setTimeout(() => { window.location.href = "https://sisitgestor2026.vercel.app/plataforma.html"; }, 2000);
            }
        } catch (err) {
            alert("Erro na conexão.");
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
