<script>
    // No Vercel, o caminho relativo /api/... aponta para as Serverless Functions
    const HELPDESK_URL = '/api/helpdesk';
    
    // Inicia com a data de hoje no formato YYYY-MM-DD
    let dataSelecionada = new Date().toISOString().split('T')[0];

    async function buscarDados() {
        try {
            // Atualiza o título da página com a data selecionada
            document.getElementById('data-titulo').innerText = dataSelecionada.split('-').reverse().join('/');
            
            // Adiciona cache-busting (_t) para forçar o Vercel a buscar dados novos
            const response = await fetch(`${HELPDESK_URL}?data=${dataSelecionada}&_t=${Date.now()}`);
            
            if (!response.ok) throw new Error('Falha na conexão');
            
            const dados = await response.json();
            renderizar(dados);
        } catch (e) {
            console.error("Erro ao carregar:", e);
            document.getElementById('corpoTabela').innerHTML = 
                '<tr><td colspan="7" style="text-align:center; color:red; padding:30px;">' +
                'Erro ao conectar com a API no Vercel. Verifique os Logs do projeto.' +
                '</td></tr>';
        }
    }

    function renderizar(lista) {
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = lista.length ? '' : '<tr><td colspan="7" style="text-align:center; padding:30px;">Nenhum atendimento encontrado para este dia.</td></tr>';
        
        let p = 0, c = 0;
        lista.forEach(item => {
            const status = item.status || 'Pendente';
            status === 'Pendente' ? p++ : c++;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.data_registro || '---'}</td>
                <td><strong>${item.nome || '---'}</strong></td>
                <td>${item.setor_sala || '---'}</td>
                <td>${item.tipo_servico || '---'}</td>
                <td style="white-space:normal">${item.descricao || ''}</td>
                <td><span class="status-badge status-${status}">${status}</span></td>
                <td>
                    <select onchange="atualizarStatusServidor('${item.id}', this.value)">
                        <option value="Pendente" ${status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="Concluido" ${status === 'Concluido' ? 'selected' : ''}>Concluído</option>
                    </select>
                </td>`;
            tbody.appendChild(tr);
        });
        
        document.getElementById('count-total').innerText = lista.length;
        document.getElementById('count-pendente').innerText = p;
        document.getElementById('count-concluido').innerText = c;
    }

    function aplicarFiltro() {
        const d = document.getElementById('inputData').value;
        if(d) {
            dataSelecionada = d;
            buscarDados();
            fecharModal();
        }
    }

    // Inicialização
    buscarDados();
    // Atualização automática a cada 30 segundos
    setInterval(buscarDados, 30000);
</script>
