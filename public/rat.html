<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel RAT - HVN</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: rgba(255, 255, 255, 0.1); --success: #22c55e; --pending: #fbbf24; }
        body { background: radial-gradient(circle at top right, #1e293b, #0f172a); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); flex: 1; text-align: center; }
        .table-container { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }
        .status-Pendente { background: rgba(251, 191, 36, 0.2); color: var(--pending); }
        .status-Concluido { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .btn-ui { background: var(--primary); color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: var(--card); margin: 10% auto; padding: 30px; border: 1px solid var(--primary); border-radius: 15px; width: 300px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>RAT - Painel de Atendimento</h1>
        <div style="display: flex; gap: 10px;">
            <button class="btn-ui" onclick="abrirModal()">📅 FILTRAR DATA</button>
            <button class="btn-ui" style="background: #64748b; color: white;" onclick="window.print()">🖨️ PDF</button>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-card">Total: <span id="count-total">0</span></div>
        <div class="stat-card" style="color:var(--pending)">Pendentes: <span id="count-pendente">0</span></div>
        <div class="stat-card" style="color:var(--success)">Concluídos: <span id="count-concluido">0</span></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr><th>Data/Hora</th><th>Solicitante</th><th>Setor</th><th>Tipo</th><th>Descrição</th><th>Status</th><th>Ação</th></tr>
            </thead>
            <tbody id="corpoTabela">
                <tr><td colspan="7" style="text-align:center; padding:30px;">Iniciando conexão...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modalData" class="modal">
    <div class="modal-content">
        <h3>Escolha a Data</h3>
        <input type="date" id="inputData" style="width: 90%; padding: 10px; margin-bottom: 20px;">
        <button class="btn-ui" onclick="aplicarFiltro()">FILTRAR</button>
        <button class="btn-ui" style="background:#ef4444; color:white;" onclick="fecharModal()">FECHAR</button>
    </div>
</div>

<script>
    // Se estiver testando localmente e o erro persistir, use a URL completa:
    // const HELPDESK_URL = 'http://127.0.0.1:5000/api/helpdesk';
    const HELPDESK_URL = '/api/helpdesk';
    
    let dataSelecionada = new Date().toISOString().split('T')[0];

    async function buscarDados() {
        try {
            const res = await fetch(`${HELPDESK_URL}?data=${dataSelecionada}&_t=${Date.now()}`);
            if (!res.ok) throw new Error();
            const dados = await res.json();
            renderizar(dados);
        } catch (e) {
            document.getElementById('corpoTabela').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red; padding:30px;">Erro ao conectar com o servidor Python. Verifique se ele está rodando.</td></tr>';
        }
    }

    function renderizar(lista) {
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = lista.length ? '' : '<tr><td colspan="7" style="text-align:center; padding:30px;">Nenhum registro encontrado para esta data.</td></tr>';
        let p = 0, c = 0;

        lista.forEach(item => {
            const status = item.status || 'Pendente';
            status === 'Pendente' ? p++ : c++;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.data_registro || '---'}</td>
                <td><strong>${item.nome || '---'}</strong></td>
                <td>${item.setor_sala || '---'}</td>
                <td>${item.tipo_servico || '---'}</td>
                <td style="white-space:normal">${item.descricao || ''}</td>
                <td><span class="status-badge status-${status}">${status}</span></td>
                <td>
                    <select onchange="atualizarStatusServidor('${item.id}', this.value)">
                        <option value="Pendente" ${status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="Concluido" ${status === 'Concluido' ? 'selected' : ''}>Concluído</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('count-total').innerText = lista.length;
        document.getElementById('count-pendente').innerText = p;
        document.getElementById('count-concluido').innerText = c;
    }

    async function atualizarStatusServidor(id, novoStatus) {
        await fetch(`${HELPDESK_URL}/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: novoStatus })
        });
        buscarDados();
    }

    function abrirModal() { document.getElementById('modalData').style.display = 'block'; }
    function fecharModal() { document.getElementById('modalData').style.display = 'none'; }
    function aplicarFiltro() { 
        const d = document.getElementById('inputData').value;
        if(d) { dataSelecionada = d; buscarDados(); fecharModal(); }
    }

    buscarDados();
    setInterval(buscarDados, 30000);
</script>
</body>
</html>
