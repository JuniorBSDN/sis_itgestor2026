<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel RAT - HVN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: rgba(255,255,255,0.1); --success: #22c55e; --pending: #fbbf24; }
        body { background: radial-gradient(circle at top right, #1e293b, #0f172a); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); flex: 1; padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; cursor: pointer; }
        .stat-card.active { border-color: var(--primary); }
        .table-container { background: var(--card); border-radius: 15px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.03); padding: 15px; color: var(--primary); font-size: 0.75rem; text-transform: uppercase; text-align: left; }
        td { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .status-Pendente { color: var(--pending); }
        .status-Concluido { color: var(--success); }
        select, input { background: #0f172a; color: white; border: 1px solid var(--border); padding: 5px; border-radius: 5px; }
        @media print { .no-print { display: none !important; } body { background: white; color: black; } }
    </style>
</head>
<body>
<div class="container">
    <header class="no-print">
        <h1>RAT - RELATÓRIO DE ATIVIDADES</h1>
        <div style="display: flex; gap: 10px;">
            <input type="date" id="filtroData" onchange="atualizarData(this.value)">
            <button onclick="window.print()" style="cursor:pointer; padding: 10px;">🖨️ Imprimir</button>
        </div>
    </header>

    <div class="stats no-print">
        <div class="stat-card active" id="card-Todos" onclick="setFiltro('Todos')">Geral <h2 id="total">0</h2></div>
        <div class="stat-card" id="card-Pendente" onclick="setFiltro('Pendente')">Pendentes <h2 id="pendentes" style="color:var(--pending)">0</h2></div>
        <div class="stat-card" id="card-Concluido" onclick="setFiltro('Concluido')">Concluídos <h2 id="concluidos" style="color:var(--success)">0</h2></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Solicitante / Setor</th>
                    <th>Descrição</th>
                    <th>Técnico</th>
                    <th>Status</th>
                    <th class="no-print">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela"></tbody>
        </table>
    </div>
</div>

<script>
    let dataAtual = new Date().toISOString().split('T')[0];
    let filtro = "Todos";
    let cache = "";

    async function load() {
        try {
            const r = await fetch(`/api/helpdesk?data=${dataAtual}&_=${Date.now()}`);
            const d = await r.json();
            if (JSON.stringify(d) === cache) return;
            cache = JSON.stringify(d);
            render(d);
        } catch (e) {}
    }

    function render(dados) {
        const tb = document.getElementById('tabela');
        let p = 0, c = 0;
        dados.forEach(i => i.status === 'Pendente' ? p++ : c++);
        document.getElementById('total').innerText = dados.length;
        document.getElementById('pendentes').innerText = p;
        document.getElementById('concluidos').innerText = c;

        tb.innerHTML = dados.filter(i => filtro === 'Todos' || i.status === filtro).map(i => `
            <tr>
                <td>${i.data_registro.split(' ')[1]}</td>
                <td><strong>${i.nome}</strong><br>${i.setor_sala}</td>
                <td>${i.descricao}</td>
                <td>${i.tecnico_responsavel || '---'}</td>
                <td class="status-${i.status}">${i.status}</td>
                <td class="no-print">
                    <select onchange="update('${i.id}', this.value)">
                        <option value="Pendente" ${i.status === 'Pendente'?'selected':''}>Pendente</option>
                        <option value="Concluido" ${i.status === 'Concluido'?'selected':''}>Concluido</option>
                    </select>
                </td>
            </tr>
        `).join('');
    }

    async function update(id, st) {
        let body = { status: st };
        if (st === 'Concluido') {
            const t = prompt("Técnico:");
            if (!t) return load();
            body.tecnico_responsavel = t;
            body.data_conclusao = new Date().toLocaleString();
        }
        await fetch(`/api/status_rat/${id}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        cache = ""; load();
    }

    function setFiltro(f) { 
        filtro = f; 
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        document.getElementById('card-'+f).classList.add('active');
        cache = ""; load(); 
    }
    
    function atualizarData(v) { dataAtual = v; cache = ""; load(); }

    setInterval(load, 2000);
    load();
</script>
</body>
</html>
