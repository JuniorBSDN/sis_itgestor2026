<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel RAT - Gestão de TI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: rgba(255, 255, 255, 0.1);
            --success: #22c55e;
            --pending: #fbbf24;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--primary); }

        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            flex: 1;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-value { display: block; font-size: 1.8rem; font-weight: 700; margin-top: 5px; }

        .table-container {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 0.05em;
        }

        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-Pendente { background: rgba(251, 191, 36, 0.1); color: var(--pending); border: 1px solid var(--pending); }
        .status-Concluido { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid var(--success); }

        select {
            background: #0f172a;
            color: white;
            border: 1px solid var(--border);
            padding: 5px;
            border-radius: 6px;
            outline: none;
        }

        .btn-ui {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-ui:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--card);
            width: 90%;
            max-width: 400px;
            margin: 15vh auto;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            text-align: center;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
        }

        @media print {
            .btn-ui, .stats-bar, select { display: none; }
            body { background: white; color: black; }
            .table-container { border: none; }
            th { color: black; border-bottom: 2px solid #000; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>RAT - Painel de Atendimentos</h1>
            <p style="margin: 5px 0 0; opacity: 0.7;">Relatório de: <strong id="data-titulo">--/--/----</strong></p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-ui" onclick="abrirModal()">📅 ALTERAR DATA</button>
            <button class="btn-ui" style="background: #64748b; color: white;" onclick="window.print()">🖨️ EXPORTAR PDF</button>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-card">Total <span class="stat-value" id="count-total">0</span></div>
        <div class="stat-card" style="color:var(--pending)">Pendentes <span class="stat-value" id="count-pendente">0</span></div>
        <div class="stat-card" style="color:var(--success)">Concluídos <span class="stat-value" id="count-concluido">0</span></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Solicitante</th>
                    <th>Setor</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <tr>
                    <td colspan="7" style="text-align: center; padding: 40px; opacity: 0.5;">Carregando registros...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modalData" class="modal">
    <div class="modal-content">
        <h2 style="margin: 0; font-size: 1.2rem;">Filtrar Atendimentos</h2>
        <input type="date" id="inputData">
        <div style="display: flex; gap: 10px;">
            <button class="btn-ui" style="flex: 1;" onclick="aplicarFiltro()">FILTRAR AGORA</button>
            <button class="btn-ui" style="flex: 1; background: var(--danger); color: white;" onclick="fecharModal()">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    // Configurações da API
    const API_URL = '/api/helpdesk';
    const STATUS_URL = '/api/status_rat';
    
    // Inicia com a data atual (padrão ISO YYYY-MM-DD para o input)
    let dataAtual = new Date().toISOString().split('T')[0];

    // Carregar dados ao iniciar
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('inputData').value = dataAtual;
        buscarDados();
    });

    async function buscarDados() {
        try {
            // Atualiza o título visual
            const dataBr = dataAtual.split('-').reverse().join('/');
            document.getElementById('data-titulo').innerText = dataBr;

            const response = await fetch(`${API_URL}?data=${dataAtual}&_t=${Date.now()}`);
            if (!response.ok) throw new Error('Erro na conexão');
            
            const dados = await response.json();
            renderizarTabela(dados);
        } catch (error) {
            console.error("Erro ao buscar dados:", error);
            document.getElementById('corpoTabela').innerHTML = `
                <tr>
                    <td colspan="7" style="text-align: center; color: var(--danger); padding: 40px;">
                        Falha ao conectar com o servidor. Verifique a API.
                    </td>
                </tr>`;
        }
    }

    function renderizarTabela(atividades) {
        const tbody = document.getElementById('corpoTabela');
        let total = atividades.length;
        let pendentes = 0;
        let concluidos = 0;

        if (total === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 40px; opacity: 0.5;">Nenhum chamado encontrado para este dia.</td></tr>`;
        } else {
            tbody.innerHTML = '';
            atividades.forEach(item => {
                const status = item.status || 'Pendente';
                if (status === 'Pendente') pendentes++;
                else concluidos++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.data_registro || '---'}</td>
                    <td><strong>${item.nome || '---'}</strong></td>
                    <td>${item.setor_sala || '---'}</td>
                    <td>${item.tipo_servico || '---'}</td>
                    <td style="white-space: normal; min-width: 250px; color: #cbd5e1;">${item.descricao || ''}</td>
                    <td><span class="status-badge status-${status}">${status}</span></td>
                    <td>
                        <select onchange="alterarStatus('${item.id}', this.value)">
                            <option value="Pendente" ${status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                            <option value="Concluido" ${status === 'Concluido' ? 'selected' : ''}>Concluído</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Atualiza contadores
        document.getElementById('count-total').innerText = total;
        document.getElementById('count-pendente').innerText = pendentes;
        document.getElementById('count-concluido').innerText = concluidos;
    }

    async function alterarStatus(id, novoStatus) {
        try {
            const res = await fetch(`${STATUS_URL}/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: novoStatus })
            });
            if (res.ok) buscarDados(); // Recarrega para atualizar contadores e badges
        } catch (error) {
            alert("Erro ao atualizar status.");
        }
    }

    // Funções do Modal
    function abrirModal() { document.getElementById('modalData').style.display = 'block'; }
    function fecharModal() { document.getElementById('modalData').style.display = 'none'; }
    
    function aplicarFiltro() {
        const novaData = document.getElementById('inputData').value;
        if (novaData) {
            dataAtual = novaData;
            buscarDados();
            fecharModal();
        }
    }

    // Atualização automática a cada 60 segundos
    setInterval(buscarDados, 60000);
</script>

</body>
</html>
