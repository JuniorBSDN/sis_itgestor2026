<script>
    const API_URL = '/api/helpdesk';
    const STATUS_URL = '/api/status_rat';
    
    let dataAtual = new Date().toISOString().split('T')[0]; // Ex: "2026-04-23"
    let ultimoDadosJSON = "";

    async function buscarDados(forcar = false) {
        try {
            const res = await fetch(`${API_URL}?cache_burst=${Date.now()}`);
            const atividades = await res.json();
            
            const dadosNovosJSON = JSON.stringify(atividades);
            if (dadosNovosJSON !== ultimoDadosJSON || forcar) {
                ultimoDadosJSON = dadosNovosJSON;
                renderizar(atividades);
            }
        } catch (e) { console.error("Erro na conexão"); }
    }

    function renderizar(atividades) {
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';
        let p = 0, c = 0;

        // FILTRO DE DATA SEGURO
        const filtrados = atividades.filter(item => {
            if (!item.data_registro) return false;
            // Converte "DD/MM/YYYY HH:MM:SS" para "YYYY-MM-DD"
            const partes = item.data_registro.split(' ')[0].split('/');
            const itemDataISO = `${partes[2]}-${partes[1]}-${partes[0]}`;
            return itemDataISO === dataAtual;
        });

        filtrados.forEach(item => {
            const status = item.status || 'Pendente';
            status === 'Pendente' ? p++ : c++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><small>${item.data_registro}</small></td>
                <td><strong>${item.nome}</strong></td>
                <td>${item.setor_sala}</td>
                <td><small>${item.tipo_servico || 'N/A'}</small></td>
                <td style="max-width:300px; white-space:normal;">${item.descricao}</td>
                <td>
                    <span class="status-badge status-${status}">${status}</span>
                    ${status === 'Concluido' && item.tecnico_responsavel ? 
                        `<br><small style="color:var(--primary); font-size:10px;">Téc: ${item.tecnico_responsavel}</small>` : ''}
                </td>
                <td class="no-print">
                    <select onchange="alterarStatus('${item.id}', this.value)" style="background:#0f172a; color:white; border:1px solid var(--border);">
                        <option value="Pendente" ${status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="Concluido" ${status === 'Concluido' ? 'selected' : ''}>Concluído</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('count-total').innerText = filtrados.length;
        document.getElementById('count-pendente').innerText = p;
        document.getElementById('count-concluido').innerText = c;
    }

    async function alterarStatus(id, novoStatus) {
        let payload = { status: novoStatus };

        if (novoStatus === 'Concluido') {
            const tecnico = prompt("Quem executou este serviço?");
            if (!tecnico) {
                buscarDados(true); // Reseta se cancelar
                return;
            }
            payload.tecnico_responsavel = tecnico;
        }

        try {
            await fetch(`${STATUS_URL}/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            buscarDados(true);
        } catch (e) { alert("Erro ao atualizar status"); }
    }

    // Inicialização e Filtro de Calendário
    document.getElementById('inputData').value = dataAtual;
    function aplicarFiltro() {
        dataAtual = document.getElementById('inputData').value;
        buscarDados(true);
        fecharModal();
    }

    buscarDados();
    setInterval(buscarDados, 3000); // Atualiza a cada 3 segundos
</script>
