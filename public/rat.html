<script>
    let dadosServidor = []; // Armazena o que vem do Firebase
    let statusAtual = "Todos";
    let periodoAtual = "todos";
    const API = '/api/helpdesk';
    const STATUS_API = '/api/status_rat';

    async function carregarDados(data = "") {
        try {
            const url = data ? `${API}?data=${data}` : API;
            const res = await fetch(url);
            const novosDados = await res.json();
            
            // Só renderiza se os dados forem diferentes ou se for a primeira carga
            if (JSON.stringify(novosDados) !== JSON.stringify(dadosServidor)) {
                dadosServidor = novosDados;
                renderizar();
            }
        } catch (e) { console.error("Erro na rede:", e); }
    }

    function renderizar() {
        const corpo = document.getElementById('tabela-corpo');
        let htmlFinal = "";
        let p = 0, c = 0;

        // 1. Calcula contadores baseados no servidor
        dadosServidor.forEach(item => {
            item.status === 'Pendente' ? p++ : c++;
        });

        // 2. Filtra os dados para exibição
        const filtrados = dadosServidor.filter(item => {
            // Filtro de Status (Card)
            const passaStatus = (statusAtual === "Todos" || item.status === statusAtual);
            
            // Filtro de Período (Select)
            let passaPeriodo = true;
            if (periodoAtual !== "todos") {
                const hoje = new Date();
                const [d, m, y] = item.data_registro.split(' ')[0].split('/');
                const dataItem = new Date(y, m - 1, d);
                
                if (periodoAtual === "dia") passaPeriodo = dataItem.toDateString() === hoje.toDateString();
                if (periodoAtual === "mes") passaPeriodo = dataItem.getMonth() === hoje.getMonth() && dataItem.getFullYear() === hoje.getFullYear();
            }

            return passaStatus && passaPeriodo;
        });

        // 3. Atualiza os cards
        document.getElementById('total-val').innerText = dadosServidor.length;
        document.getElementById('pendente-val').innerText = p;
        document.getElementById('concluido-val').innerText = c;

        // 4. Gera o HTML da tabela
        filtrados.forEach(item => {
            htmlFinal += `
                <tr class="hover:bg-slate-700/20 transition-colors">
                    <td><small>${item.data_registro}</small></td>
                    <td><b>${item.nome}</b><br><small class="text-sky-500">${item.setor_sala}</small></td>
                    <td>${item.descricao}</td>
                    <td style="color: ${item.status === 'Pendente' ? 'var(--pending)' : 'var(--success)'}; font-weight:bold;">${item.status}</td>
                    <td><small>${item.tecnico_responsavel || '-'}</small></td>
                    <td class="no-print">
                        ${item.status === 'Pendente' ? 
                        `<button class="btn-finish" onclick="concluir('${item.id}')">Concluir</button>` : '✅'}
                    </td>
                </tr>`;
        });

        // Atualiza o DOM uma única vez (evita o "piscar")
        corpo.innerHTML = htmlFinal;
    }

    async function concluir(id) {
        const tec = prompt("Nome do Técnico Responsável:");
        if(!tec) return;
        
        try {
            await fetch(`${STATUS_API}/${id}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    status: 'Concluido', 
                    tecnico_responsavel: tec, 
                    data_conclusao: new Date().toLocaleString('pt-BR')
                })
            });
            carregarDados(); // Força atualização imediata
        } catch (e) { alert("Erro ao salvar."); }
    }

    function setFiltroStatus(s) {
        statusAtual = s;
        document.querySelectorAll('.stat-card').forEach(card => card.classList.remove('active'));
        document.getElementById(`card-${s}`).classList.add('active');
        renderizar();
    }

    function filtrarPorPeriodo(p) {
        periodoAtual = p;
        renderizar();
    }

    // Inicialização
    carregarDados();
    // Aumentamos o intervalo para 10s para dar estabilidade à UI
    setInterval(carregarDados, 10000); 
</script>
