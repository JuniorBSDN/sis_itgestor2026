<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel RAT - Tempo Real - Instituto Impar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: rgba(255, 255, 255, 0.1);
            --success: #22c55e;
            --pending: #fbbf24;
        }

        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px; min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); padding: 20px; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card); padding: 20px; border-radius: 16px;
            text-align: center; border: 1px solid var(--border);
        }

        .stat-card h3 { margin: 0; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 2rem; font-weight: 700; }

        .table-container {
            background: var(--card); border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.05); padding: 15px; text-align: left; font-size: 0.8rem; color: #94a3b8; }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

        .status-badge {
            padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
        }
        .bg-pending { background: rgba(251, 191, 36, 0.1); color: var(--pending); }
        .bg-success { background: rgba(34, 197, 94, 0.1); color: var(--success); }

        select {
            background: #0f172a; color: white; border: 1px solid var(--border);
            padding: 5px; border-radius: 5px; cursor: pointer;
        }

        .btn-filter {
            background: var(--primary); color: #0f172a; border: none;
            padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;
        }

        /* Modal */
        #modalData {
            display: none; position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.8);
        }
        .modal-content {
            background: var(--card); margin: 15% auto; padding: 30px;
            width: 300px; border-radius: 16px; text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; font-size: 1.5rem; color: var(--primary);">PAINEL RAT</h1>
            <p style="margin:5px 0 0; font-size: 0.8rem; opacity: 0.6;">Monitorização de Atividades TI</p>
        </div>
        <button class="btn-filter" onclick="abrirModal()">Filtrar por Data</button>
    </header>

    <div class="stats">
        <div class="stat-card"><h3>Total</h3><p id="count-total">0</p></div>
        <div class="stat-card"><h3>Pendentes</h3><p id="count-pendente" style="color: var(--pending);">0</p></div>
        <div class="stat-card"><h3>Concluídos</h3><p id="count-concluido" style="color: var(--success);">0</p></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DATA/HORA</th>
                    <th>SOLICITANTE</th>
                    <th>DESCRIÇÃO</th>
                    <th>STATUS</th>
                    <th>TÉCNICO</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>
</div>

<div id="modalData">
    <div class="modal-content">
        <h3>Escolher Data</h3>
        <input type="date" id="inputData" style="width:100%; padding:10px; margin-bottom:20px;">
        <button class="btn-filter" onclick="aplicarFiltro()">Aplicar</button>
        <button onclick="fecharModal()" style="background:none; color:white; border:none; margin-top:10px; cursor:pointer;">Fechar</button>
    </div>
</div>

<script>
    const API_URL = '/api/helpdesk';
    const STATUS_URL = '/api/status_rat';
    let ultimoDadosJSON = "";
    let dataAtual = new Date().toISOString().split('T')[0];

    async function buscarDados(forcar = false) {
        try {
            const url = `${API_URL}?data=${dataAtual}`;
            const res = await fetch(url);
            const atividades = await res.json();
            
            const stringDados = JSON.stringify(atividades);
            if (stringDados === ultimoDadosJSON && !forcar) return;
            ultimoDadosJSON = stringDados;

            renderizarTabela(atividades);
        } catch (e) { console.error("Erro ao procurar dados:", e); }
    }

    function renderizarTabela(atividades) {
        const tbody = document.getElementById('tabela-corpo');
        tbody.innerHTML = "";
        let p = 0, c = 0;

        atividades.forEach(item => {
            if (item.status === 'Pendente') p++; else c++;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><small>${item.data_registro}</small></td>
                <td><strong>${item.nome}</strong><br><small>${item.setor_sala}</small></td>
                <td style="max-width: 300px;">${item.descricao}</td>
                <td>
                    <select onchange="alterarStatus('${item.id}', this.value)">
                        <option value="Pendente" ${item.status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="Concluido" ${item.status === 'Concluido' ? 'selected' : ''}>Concluído</option>
                    </select>
                </td>
                <td><small>${item.tecnico_responsavel || '-'}</small></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('count-total').innerText = atividades.length;
        document.getElementById('count-pendente').innerText = p;
        document.getElementById('count-concluido').innerText = c;
    }

    async function alterarStatus(id, novoStatus) {
        let corpo = { status: novoStatus };

        if (novoStatus === 'Concluido') {
            const tecnico = prompt("Digite o nome do Técnico Responsável:");
            if (!tecnico) {
                buscarDados(true); // Reseta o select se cancelar
                return;
            }
            corpo.tecnico_responsavel = tecnico;
            corpo.data_conclusao = new Date().toLocaleString('pt-BR');
        }

        try {
            const res = await fetch(`${STATUS_URL}/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(corpo)
            });
            if (res.ok) buscarDados(true);
        } catch (e) { alert("Erro ao atualizar status."); }
    }

    function abrirModal() { document.getElementById('modalData').style.display = 'block'; }
    function fecharModal() { document.getElementById('modalData').style.display = 'none'; }

    function aplicarFiltro() {
        const novaData = document.getElementById('inputData').value;
        if (novaData) {
            dataAtual = novaData;
            ultimoDadosJSON = "";
            buscarDados();
            fecharModal();
        }
    }

    // Inicialização e Tempo Real
    buscarDados();
    setInterval(buscarDados, 3000);
</script>

</body>
</html>
