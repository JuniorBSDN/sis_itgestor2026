<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel RAT - Tempo Real</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary:#38bdf8;
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f1f5f9;
    --border:rgba(255,255,255,0.1);
    --success:#22c55e;
    --pending:#fbbf24;
    --danger:#ef4444;
}

*{box-sizing:border-box;}

body{
    background: radial-gradient(circle at top right,#1e293b,#0f172a);
    color: var(--text);
    font-family:'Inter',sans-serif;
    margin:0;padding:20px;
}

.container{max-width:1200px;margin:auto;}

header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:20px;border-bottom:1px solid var(--border);
    padding-bottom:15px;
}

.stat-card{
    background:var(--card);
    padding:20px;
    border-radius:12px;
    flex:1;
    text-align:center;
    cursor:pointer;
    border:1px solid var(--border);
}

.stat-card.ativo{
    border:1px solid var(--primary);
    box-shadow:0 0 10px var(--primary);
}

.stats-bar{display:flex;gap:15px;margin-bottom:15px;}

.table-container{
    background:var(--card);
    border-radius:16px;
    border:1px solid var(--border);
    overflow:hidden;
}

table{width:100%;border-collapse:collapse;}

th,td{padding:12px;border-bottom:1px solid var(--border);}

.status-badge{padding:4px 10px;border-radius:20px;font-size:12px;}
.status-Pendente{color:var(--pending);}
.status-Concluido{color:var(--success);}

.btn-ui{
    background:var(--primary);
    border:none;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
}

.modal-content{
    background:var(--card);
    padding:20px;
    width:320px;
    margin:15vh auto;
    border-radius:12px;
}
</style>
</head>

<body>

<div class="container">

<header>
    <div>
        <h1>RAT - Painel <span id="sync-indicator">●</span></h1>
        <p>Filtro: <strong id="data-titulo">Hoje</strong></p>
    </div>

    <div style="display:flex;gap:10px;">
        <button class="btn-ui" onclick="abrirModal()">Filtro</button>
        <button class="btn-ui" onclick="window.print()">PDF</button>
    </div>
</header>

<!-- 🔥 CARDS (FILTRO STATUS) -->
<div class="stats-bar">
    <div class="stat-card" id="card-todos" onclick="setFiltro('todos')">
        Total <span id="count-total">0</span>
    </div>

    <div class="stat-card" id="card-pendente" onclick="setFiltro('pendente')">
        Pendentes <span id="count-pendente">0</span>
    </div>

    <div class="stat-card" id="card-concluido" onclick="setFiltro('concluido')">
        Concluídos <span id="count-concluido">0</span>
    </div>
</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>Data</th>
<th>Nome</th>
<th>Setor</th>
<th>Tipo</th>
<th>Descrição</th>
<th>Status</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="corpoTabela"></tbody>
</table>
</div>

</div>

<!-- 🔥 MODAL FILTRO DATA -->
<div id="modalData" class="modal">
<div class="modal-content">

<h3>Filtrar</h3>

<select id="tipoFiltro">
<option value="dia">Hoje</option>
<option value="semana">Semana</option>
<option value="mes">Mês</option>
<option value="ano">Ano</option>
</select>

<input type="date" id="inputData">

<button class="btn-ui" onclick="aplicarFiltro()">Aplicar</button>

</div>
</div>

<!-- 🔥 MODAL TECNICO -->
<div id="modalTecnico" class="modal">
<div class="modal-content">
<h3>Finalizar</h3>

<input id="nomeTecnico" placeholder="Nome do técnico">

<button class="btn-ui" onclick="confirmarConclusao()">OK</button>
<button class="btn-ui" onclick="fecharModalTecnico()">Cancelar</button>

</div>
</div>

<script>
const API_URL='/api/helpdesk';
const STATUS_URL='/api/status_rat';

let filtroStatus='todos';
let tipoFiltro='dia';
let dataSelecionada=new Date();
let idConclusao=null;

function setFiltro(tipo){
    filtroStatus=tipo;

    document.querySelectorAll('.stat-card').forEach(c=>c.classList.remove('ativo'));
    document.getElementById('card-'+tipo).classList.add('ativo');

    buscarDados();
}

function abrirModal(){document.getElementById('modalData').style.display='block';}

function aplicarFiltro(){
    tipoFiltro=document.getElementById('tipoFiltro').value;
    dataSelecionada=new Date(document.getElementById('inputData').value);
    buscarDados();
}

async function buscarDados(){
    const res=await fetch(API_URL);
    const dados=await res.json();

    renderizar(dados);

    document.getElementById('sync-indicator').style.opacity=Math.random();
}

function filtrarPorPeriodo(lista){
    return lista.filter(item=>{
        const d=new Date(item.data_registro);

        if(tipoFiltro==='dia') return d.toDateString()===dataSelecionada.toDateString();
        if(tipoFiltro==='mes') return d.getMonth()===dataSelecionada.getMonth();
        if(tipoFiltro==='ano') return d.getFullYear()===dataSelecionada.getFullYear();

        if(tipoFiltro==='semana'){
            const inicio=new Date(dataSelecionada);
            inicio.setDate(inicio.getDate()-inicio.getDay());
            const fim=new Date(inicio);
            fim.setDate(fim.getDate()+6);
            return d>=inicio && d<=fim;
        }
    });
}

function renderizar(lista){

    lista=filtrarPorPeriodo(lista);

    const tbody=document.getElementById('corpoTabela');
    tbody.innerHTML='';

    let p=0,c=0;

    lista.forEach(item=>{

        const status=item.status||'Pendente';

        if(filtroStatus==='pendente' && status!=='Pendente') return;
        if(filtroStatus==='concluido' && status!=='Concluido') return;

        status==='Pendente'?p++:c++;

        const tr=document.createElement('tr');

        tr.innerHTML=`
        <td>${item.data_registro}</td>
        <td>${item.nome}</td>
        <td>${item.setor_sala}</td>
        <td>${item.tipo_servico}</td>
        <td>${item.descricao}</td>
        <td>
            ${status}
            ${status==='Concluido' && item.tecnico ? `<br><small>${item.tecnico}</small>`:''}
        </td>
        <td>
            <select onchange="alterarStatus('${item.id}',this.value)">
                <option ${status==='Pendente'?'selected':''}>Pendente</option>
                <option ${status==='Concluido'?'selected':''}>Concluido</option>
            </select>
        </td>
        `;

        tbody.appendChild(tr);
    });

    document.getElementById('count-total').innerText=lista.length;
    document.getElementById('count-pendente').innerText=p;
    document.getElementById('count-concluido').innerText=c;
}

function alterarStatus(id,status){
    if(status==='Concluido'){
        idConclusao=id;
        document.getElementById('modalTecnico').style.display='block';
        return;
    }
    salvar(id,status);
}

async function salvar(id,status,tecnico=null){
    await fetch(`${STATUS_URL}/${id}`,{
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({status,tecnico})
    });
    buscarDados();
}

function confirmarConclusao(){
    const t=document.getElementById('nomeTecnico').value;
    if(!t) return alert('Informe técnico');
    salvar(idConclusao,'Concluido',t);
    fecharModalTecnico();
}

function fecharModalTecnico(){
    document.getElementById('modalTecnico').style.display='none';
    document.getElementById('nomeTecnico').value='';
}

buscarDados();
setInterval(buscarDados,2000);
</script>

</body>
</html>
