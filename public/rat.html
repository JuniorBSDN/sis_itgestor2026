<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel RAT - HVN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8; --bg: #0f172a; --card: #1e293b;
            --text: #f1f5f9; --border: rgba(255, 255, 255, 0.1);
            --success: #22c55e; --pending: #fbbf24;
        }
        body {
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px;
        }
        .container { max-width: 1300px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 10px; flex: 1; text-align: center; border: 1px solid var(--border); }
        .table-container { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.05); padding: 12px; text-align: left; color: var(--primary); font-size: 0.8rem; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .status-Pendente { background: rgba(251,191,36,0.2); color: var(--pending); }
        .status-Concluido { background: rgba(34,197,94,0.2); color: var(--success); }
        .btn { background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; }
        .modal-content { background: var(--card); padding: 20px; width: 300px; margin: 100px auto; border-radius: 10px; }
        select { background: #0f172a; color: #fff; border: 1px solid var(--border); padding: 4px; border-radius: 4px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RAT <small style="font-size: 0.5em; opacity: 0.5;">Hospital Municipal</small></h1>
        <div class="no-print">
            <button class="btn" onclick="document.getElementById('modalData').style.display='block'">📅 Filtrar Data</button>
            <button class="btn" onclick="window.print()" style="background:#94a3b8">🖨️ PDF</button>
        </div>
    </header>

    <div class="stats no-print">
        <div class="stat-card">Total: <span id="count-total">0</span></div>
        <div class="stat-card">Pendentes: <span id="count-pendente" style="color:var(--pending)">0</span></div>
        <div class="stat-card">Concluídos: <span id="count-concluido" style="color:var(--success)">0</span></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Solicitante</th>
                    <th>Setor</th>
                    <th>Descrição</th>
                    <th>Status / Técnico</th>
                    <th class="no-print">Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<div id="modalData" class="modal">
    <div class="modal-content">
        <h3>Filtrar Data</h3>
        <input type="date" id="inputData" style="width:100%; margin: 10px 0; padding: 5px;">
        <button class="btn" onclick="aplicarFiltro()" style="width:100%">Aplicar</button>
    </div>
</div>

<script>
    const API_URL = '/api/helpdesk';
    const STATUS_URL = '/api/status_rat';
    
    let dataFiltroISO = new Date().toISOString().split('T')[0]; // Pega hoje: "2026-04-23"
    let ultimoDadosJSON = "";

    async function buscarDados(forcar = false) {
        try {
            const res = await fetch(`${API_URL}?cache=${Date.now()}`);
            const atividades = await res.json();
            const dadosString = JSON.stringify(atividades);

            if (dadosString !== ultimoDadosJSON || forcar) {
                ultimoDadosJSON = dadosString;
                renderizar(atividades);
            }
        } catch (e) { console.error("Erro na API"); }
    }

    function renderizar(lista) {
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';
        let p = 0, c = 0;

        // FILTRO À PROVA DE FALHAS
        const filtrados = lista.filter(item => {
            // 1. Se tiver o campo data_busca (novo formato), usa ele
            if (item.data_busca) return item.data_busca === dataFiltroISO;

            // 2. Se não tiver (formato antigo), tenta converter "23/04/2026" para "2026-04-23"
            if (item.data_registro) {
                const partes = item.data_registro.split(' ')[0].split('/');
                if (partes.length === 3) {
                    const itemISO = `${partes[2]}-${partes[1]}-${partes[0]}`;
                    return itemISO === dataFiltroISO;
                }
            }
            return false;
        });

        if (filtrados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:50px; opacity:0.5;">Nenhum atendimento encontrado para esta data.</td></tr>';
        }

        filtrados.forEach(item => {
            const status = item.status || 'Pendente';
            status === 'Pendente' ? p++ : c++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><small>${item.data_registro}</small></td>
                <td><strong>${item.nome}</strong></td>
                <td>${item.setor_sala}</td>
                <td>${item.descricao}</td>
                <td>
                    <span class="status-badge status-${status}">${status}</span>
                    ${status === 'Concluido' && item.tecnico_responsavel ? 
                        `<br><small style="color:var(--primary); font-size: 10px;">Téc: ${item.tecnico_responsavel}</small>` : ''}
                </td>
                <td class="no-print">
                    <select onchange="alterarStatus('${item.id}', this.value)">
                        <option value="Pendente" ${status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="Concluido" ${status === 'Concluido' ? 'selected' : ''}>Concluído</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('count-total').innerText = filtrados.length;
        document.getElementById('count-pendente').innerText = p;
        document.getElementById('count-concluido').innerText = c;
    }

    async function alterarStatus(id, novoStatus) {
        let payload = { status: novoStatus };
        if (novoStatus === 'Concluido') {
            const tecnico = prompt("Nome do técnico responsável:");
            if (!tecnico) { buscarDados(true); return; }
            payload.tecnico_responsavel = tecnico;
        }
        try {
            await fetch(`${STATUS_URL}/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            buscarDados(true);
        } catch (e) { alert("Erro ao atualizar status"); }
    }

    function aplicarFiltro() {
        const novaData = document.getElementById('inputData').value;
        if (novaData) {
            dataFiltroISO = novaData;
            buscarDados(true);
            document.getElementById('modalData').style.display = 'none';
        }
    }

    // Inicializa
    document.getElementById('inputData').value = dataFiltroISO;
    buscarDados();
    setInterval(buscarDados, 3000); 
</script>

</body>
</html>
