<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel RAT - HVN</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: rgba(255, 255, 255, 0.1); --success: #22c55e; --pending: #fbbf24; }
        body { background: radial-gradient(circle at top right, #1e293b, #0f172a); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        
        .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); flex: 1; text-align: center; font-weight: bold; }
        
        .table-container { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
        .descricao-cell { white-space: normal; min-width: 300px; }
        
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; }
        .status-Pendente { background: rgba(251, 191, 36, 0.2); color: var(--pending); }
        .status-Concluido { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: var(--card); margin: 15% auto; padding: 25px; border: 1px solid var(--primary); border-radius: 15px; width: 300px; text-align: center; }
        .btn-ui { background: var(--primary); color: #0f172a; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div>
            <h1>RAT - Painel de Atendimento</h1>
            <p>Filtro atual: <strong id="filtro-texto">Todos os Registros</strong></p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-ui" onclick="abrirModal()">📅 RELATÓRIO DIÁRIO</button>
            <button class="btn-ui" style="background:#64748b; color:white;" onclick="window.print()">🖨️ PDF</button>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-card">Total: <span id="total">0</span></div>
        <div class="stat-card" style="color:var(--pending)">Pendentes: <span id="pendentes">0</span></div>
        <div class="stat-card" style="color:var(--success)">Concluídos: <span id="concluidos">0</span></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Solicitante</th>
                    <th>Setor</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<div id="modalData" class="modal">
    <div class="modal-content">
        <h3>Filtrar por Data</h3>
        <input type="date" id="inputData" style="width: 80%; padding: 10px; margin: 15px 0;">
        <br>
        <button class="btn-ui" onclick="aplicarFiltro()">FILTRAR</button>
        <button class="btn-ui" style="background:#ef4444; color:white;" onclick="fecharModal()">VER TUDO</button>
    </div>
</div>

<script>
    const API_URL = '/api/helpdesk';
    let dataFiltro = ""; // Vazio para mostrar tudo inicialmente

    async function buscarDados() {
        try {
            const url = dataFiltro ? `${API_URL}?data=${dataFiltro}` : API_URL;
            const response = await fetch(url);
            const dados = await response.json();
            renderizar(dados);
        } catch (e) { console.error(e); }
    }

    function renderizar(lista) {
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';
        let p = 0, c = 0;

        lista.forEach(item => {
            const status = item.status || 'Pendente';
            status === 'Pendente' ? p++ : c++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.data_registro || ''}</td>
                <td><strong>${item.nome || ''}</strong></td>
                <td>${item.setor_sala || ''}</td>
                <td>${item.tipo_servico || ''}</td>
                <td class="descricao-cell">${item.descricao || ''}</td>
                <td><span class="status-badge status-${status}">${status}</span></td>
                <td>
                    <select onchange="atualizarStatusServidor('${item.id}', this.value)" style="background:#0f172a; color:white; border:1px solid var(--border); padding:5px; border-radius:5px;">
                        <option value="Pendente" ${status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="Concluido" ${status === 'Concluido' ? 'selected' : ''}>Concluído</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('total').innerText = lista.length;
        document.getElementById('pendentes').innerText = p;
        document.getElementById('concluidos').innerText = c;
    }

async function buscarDados() {
    try {
        // Se dataSelecionada estiver vazia, a API traz tudo. 
        // Se tiver valor (ex: 2026-01-02), a API filtra.
        const url = dataSelecionada ? `${HELPDESK_URL}?data=${dataSelecionada}` : HELPDESK_URL;
        
        const response = await fetch(url);
        const dados = await response.json();
        renderizar(dados);
    } catch (e) { console.error("Erro:", e); }
}

    function abrirModal() { document.getElementById('modalData').style.display = 'block'; }
    function fecharModal() { 
        dataFiltro = ""; 
        document.getElementById('filtro-texto').innerText = "Todos os Registros";
        document.getElementById('modalData').style.display = 'none'; 
        buscarDados();
    }
    function aplicarFiltro() {
        const d = document.getElementById('inputData').value;
        if(d) {
            dataFiltro = d;
            document.getElementById('filtro-texto').innerText = d.split('-').reverse().join('/');
            buscarDados();
            document.getElementById('modalData').style.display = 'none';
        }
    }

    buscarDados();
    setInterval(buscarDados, 30000);
</script>
</body>
</html>
