<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel RAT - HVN</title>
    <style>
        :root {
            --primary: #38bdf8; --bg: #0f172a; --card: #1e293b;
            --text: #f1f5f9; --border: rgba(255, 255, 255, 0.1);
            --success: #22c55e; --pending: #fbbf24;
        }

        /* Estilos de tela (Dark Mode) */
        body { 
            background: radial-gradient(circle at top right, #1e293b, #0f172a); 
            color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; 
        }
        .container { max-width: 1300px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); flex: 1; text-align: center; }
        .table-container { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; } /* table-layout fixed ajuda na organização */
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); word-wrap: break-word; }
        th { background: rgba(255,255,255,0.03); color: var(--primary); font-size: 0.75rem; text-transform: uppercase; }
        
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }
        .status-Pendente { background: rgba(251, 191, 36, 0.2); color: var(--pending); }
        .status-Concluido { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        
        select { background: #0f172a; color: white; border: 1px solid var(--border); padding: 5px; border-radius: 6px; }
        .btn-print { background: var(--primary); color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* ============================================================
           CONFIGURAÇÃO EXCLUSIVA PARA IMPRESSÃO / PDF
           ============================================================ */
        @media print {
            @page { size: landscape; margin: 1cm; } /* Força orientação paisagem para caber tudo */
            
            body { background: white !important; color: black !important; padding: 0; }
            .container { max-width: 100%; width: 100%; }
            
            /* Esconde elementos desnecessários no PDF */
            .btn-print, header p, .actions-col, select, .stats-bar { display: none !important; }
            
            header h1 { color: black !important; font-size: 18pt; margin-bottom: 10px; }
            
            .table-container { border: none !important; box-shadow: none !important; background: white !important; }
            
            table { 
                width: 100% !important; 
                border: 1px solid #333 !important; 
                color: black !important;
                table-layout: auto; /* Deixa o navegador ajustar as colunas no papel */
            }
            
            th { 
                background-color: #f0f0f0 !important; 
                color: black !important; 
                border: 1px solid #333 !important;
                font-size: 9pt !important;
            }
            
            td { 
                border: 1px solid #ccc !important; 
                font-size: 8pt !important; 
                color: black !important;
            }

            .status-badge { 
                border: 1px solid #000 !important; 
                color: black !important; 
                background: none !important; 
                text-transform: uppercase;
            }

            /* Garante que o texto da descrição não seja cortado */
            .descricao-cell { white-space: normal !important; max-width: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Relatório de Atendimento Técnico (RAT)</h1>
            <p>Hospital de Vila Nova - T.I.</p>
        </div>
        <button class="btn-print" onclick="window.print()">🖨️ GERAR PDF ORGANIZADO</button>
    </header>

    <div class="stats-bar">
        <div class="stat-card">Total: <span id="count-total">0</span></div>
        <div class="stat-card">Pendentes: <span id="count-pendente">0</span></div>
        <div class="stat-card">Concluídos: <span id="count-concluido">0</span></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 120px;">Data/Hora</th>
                    <th>Solicitante</th>
                    <th>Setor</th>
                    <th>Tipo</th>
                    <th style="width: 30%;">Descrição</th>
                    <th>Status</th>
                    <th class="actions-col">Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = '/api/helpdesk';
    const STATUS_URL = '/api/status_rat';

    async function buscarDados() {
        try {
            const response = await fetch(API_URL);
            const dados = await response.json();
            renderizar(dados);
        } catch (e) { console.error("Erro ao buscar:", e); }
    }

    function renderizar(lista) {
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';
        let p = 0, c = 0;

        lista.forEach(item => {
            const status = item.status || 'Pendente';
            status === 'Pendente' ? p++ : c++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.data_registro || ''}</td>
                <td><strong>${item.nome || ''}</strong></td>
                <td>${item.setor_sala || ''}</td>
                <td>${item.tipo_servico || ''}</td>
                <td class="descricao-cell">${item.descricao || ''}</td>
                <td><span class="status-badge status-${status}">${status}</span></td>
                <td class="actions-col">
                    <select onchange="atualizarStatusServidor('${item.id}', this.value)">
                        <option value="Pendente" ${status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="Concluido" ${status === 'Concluido' ? 'selected' : ''}>Concluído</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('count-total').innerText = lista.length;
        document.getElementById('count-pendente').innerText = p;
        document.getElementById('count-concluido').innerText = c;
    }

    async function atualizarStatusServidor(id, novoStatus) {
        if(!id || id === 'undefined') {
            alert("ID não encontrado. Atualize a página.");
            return;
        }
        try {
            const response = await fetch(`${STATUS_URL}/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: novoStatus })
            });
            if(response.ok) buscarDados();
        } catch (e) { console.error(e); }
    }

    buscarDados();
    setInterval(buscarDados, 30000);
</script>

</body>
</html>
