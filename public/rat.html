<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel RAT - HVN</title>
    <style>
        :root {
            --primary: #38bdf8; --bg: #0f172a; --card: #1e293b;
            --text: #f1f5f9; --border: rgba(255, 255, 255, 0.1);
            --success: #22c55e; --pending: #fbbf24;
        }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px;
        }

        .container { max-width: 100%; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px;
        }

        .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); flex: 1; text-align: center; }

        /* Mantém a tabela horizontal com scroll lateral */
        .table-container {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px; /* Força a horizontalidade */
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .descricao-cell {
            white-space: normal;
            min-width: 300px;
        }

        th { background: rgba(255,255,255,0.03); color: var(--primary); font-size: 0.8rem; text-transform: uppercase; }

        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }
        .status-Pendente { background: rgba(251, 191, 36, 0.2); color: var(--pending); }
        .status-Concluido { background: rgba(34, 197, 94, 0.2); color: var(--success); }

        select { background: #0f172a; color: white; border: 1px solid var(--border); padding: 6px; border-radius: 6px; cursor: pointer; }
        .btn-ui { background: var(--primary); color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Estilos do Modal de Data */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.8);
        }
        .modal-content {
            background: var(--card); margin: 12% auto; padding: 30px;
            border: 1px solid var(--primary); border-radius: 15px; width: 320px;
            text-align: center;
        }

        @media print {
            @page { size: landscape; margin: 1cm; }
            body { background: white !important; color: black !important; padding: 0; }
            .btn-ui, .actions-col, select, .stats-bar, header button { display: none !important; }
            table { border: 1px solid #000; min-width: 100%; }
            th, td { border: 1px solid #ccc !important; color: black !important; white-space: normal; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>RAT - Painel de Atendimento</h1>
            <p>Visualizando registros de: <strong id="data-titulo">...</strong></p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-ui" onclick="abrirModal()">📅 MUDAR DATA</button>
            <button class="btn-ui" style="background: #64748b; color: white;" onclick="window.print()">🖨️ PDF</button>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-card">Total: <span id="count-total">0</span></div>
        <div class="stat-card" style="color:var(--pending)">Pendentes: <span id="count-pendente">0</span></div>
        <div class="stat-card" style="color:var(--success)">Concluídos: <span id="count-concluido">0</span></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Solicitante</th>
                    <th>Setor</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Status</th>
                    <th class="actions-col">Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<div id="modalData" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0">Filtrar por Dia</h3>
        <input type="date" id="inputData" style="width: 90%; padding: 10px; margin: 20px 0; border-radius: 5px; border: none;">
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn-ui" onclick="aplicarFiltro()">FILTRAR</button>
            <button class="btn-ui" style="background:#ef4444; color:white;" onclick="fecharModal()">FECHAR</button>
        </div>
    </div>
</div>

<script>
    // URL base unificada conforme as rotas do seu index.py
    const HELPDESK_URL = '/api/helpdesk';

    // Define hoje como data inicial no formato AAAA-MM-DD
    let dataSelecionada = new Date().toISOString().split('T')[0];

    async function buscarDados() {
        try {
            // Atualiza o título com a data formatada para o usuário (DD/MM/AAAA)
            document.getElementById('data-titulo').innerText = dataSelecionada.split('-').reverse().join('/');

            // Faz a requisição enviando a data para o filtro do backend
            const response = await fetch(`${HELPDESK_URL}?data=${dataSelecionada}`);
            const dados = await response.json();
            renderizar(dados);
        } catch (e) { console.error("Erro ao carregar dados:", e); }
    }

    function renderizar(lista) {
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';
        let p = 0, c = 0;

        lista.forEach(item => {
            const status = item.status || 'Pendente';
            status === 'Pendente' ? p++ : c++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.data_registro || ''}</td>
                <td><strong>${item.nome || ''}</strong></td>
                <td>${item.setor_sala || ''}</td>
                <td>${item.tipo_servico || ''}</td>
                <td class="descricao-cell">${item.descricao || ''}</td>
                <td><span class="status-badge status-${status}">${status}</span></td>
                <td class="actions-col">
                    <select onchange="atualizarStatusServidor('${item.id}', this.value)">
                        <option value="Pendente" ${status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="Concluido" ${status === 'Concluido' ? 'selected' : ''}>Concluído</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('count-total').innerText = lista.length;
        document.getElementById('count-pendente').innerText = p;
        document.getElementById('count-concluido').innerText = c;
    }

    async function atualizarStatusServidor(id, novoStatus) {
        if(!id || id === 'undefined') {
            alert("ID do documento não encontrado. Verifique os dados no Firebase.");
            return;
        }
        try {
            // Usa a rota PATCH /api/helpdesk/<id> que você criou
            await fetch(`${HELPDESK_URL}/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: novoStatus })
            });
            buscarDados();
        } catch (e) { console.error("Erro ao atualizar status:", e); }
    }

    // Funções do Modal
    function abrirModal() { document.getElementById('modalData').style.display = 'block'; }
    function fecharModal() { document.getElementById('modalData').style.display = 'none'; }

    function aplicarFiltro() {
        const d = document.getElementById('inputData').value;
        if(d) {
            dataSelecionada = d;
            buscarDados();
            fecharModal();
        }
    }

    // Inicialização
    buscarDados();
    // Atualiza a cada 30 segundos mantendo a data filtrada
    setInterval(buscarDados, 30000);
</script>
</body>
</html>
