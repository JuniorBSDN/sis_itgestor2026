<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel RAT - Tempo Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); }
        .status-pendente { color: #fbbf24; }
        .status-concluido { color: #22c55e; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-slate-800 p-6 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">PAINEL DE ATIVIDADES (RAT)</h1>
                <p class="text-slate-400 text-sm">Monitoramento em Tempo Real - Instituto Impar</p>
            </div>
            <div class="flex gap-4">
                <button onclick="abrirFiltro()" class="bg-slate-700 px-4 py-2 rounded-lg hover:bg-slate-600">Filtrar Data</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card p-6 rounded-xl text-center">
                <p class="text-slate-400">Total de Chamados</p>
                <h2 id="count-total" class="text-3xl font-bold">0</h2>
            </div>
            <div class="card p-6 rounded-xl text-center">
                <p class="text-amber-400">Pendentes</p>
                <h2 id="count-pendente" class="text-3xl font-bold text-amber-400">0</h2>
            </div>
            <div class="card p-6 rounded-xl text-center">
                <p class="text-emerald-400">Concluídos</p>
                <h2 id="count-concluido" class="text-3xl font-bold text-emerald-400">0</h2>
            </div>
        </div>

        <div class="card rounded-2xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-700 text-slate-300 text-sm">
                    <tr>
                        <th class="p-4">Data/Hora</th>
                        <th class="p-4">Solicitante/Setor</th>
                        <th class="p-4">Descrição</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-center">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/helpdesk';
        const STATUS_URL = '/api/status_rat';
        let ultimoDadosJSON = "";

        async function buscarDados() {
            try {
                const res = await fetch(API_URL);
                const atividades = await res.json();
                const stringDados = JSON.stringify(atividades);

                if (stringDados === ultimoDadosJSON) return;
                ultimoDadosJSON = stringDados;

                renderizarTabela(atividades);
            } catch (e) { console.error("Erro ao carregar:", e); }
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = "";
            let p = 0, c = 0;

            dados.forEach(item => {
                if (item.status === 'Pendente') p++; else c++;
                
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-700 hover:bg-slate-800/50 transition-colors";
                tr.innerHTML = `
                    <td class="p-4 text-sm text-slate-400">${item.data_registro}</td>
                    <td class="p-4">
                        <span class="font-bold">${item.nome}</span><br>
                        <span class="text-xs text-sky-400">${item.setor_sala}</span>
                    </td>
                    <td class="p-4 text-sm max-w-xs truncate">${item.descricao}</td>
                    <td class="p-4">
                        <span class="${item.status === 'Pendente' ? 'status-pendente' : 'status-concluido'} font-bold">
                            ${item.status}
                        </span>
                    </td>
                    <td class="p-4 text-center">
                        ${item.status === 'Pendente' ? 
                            `<button onclick="finalizarChamado('${item.id}')" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded text-xs">Concluir</button>` : 
                            `<span class="text-xs text-slate-500 italic">Feito por: ${item.tecnico_responsavel || 'TI'}</span>`
                        }
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('count-total').innerText = dados.length;
            document.getElementById('count-pendente').innerText = p;
            document.getElementById('count-concluido').innerText = c;
        }

        async function finalizarChamado(id) {
            const tecnico = prompt("Nome do Técnico Responsável:");
            if (!tecnico) return;

            const agora = new Date().toLocaleString('pt-BR');
            try {
                const res = await fetch(`${STATUS_URL}/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        status: 'Concluido',
                        tecnico_responsavel: tecnico,
                        data_conclusao: agora
                    })
                });
                if (res.ok) buscarDados();
            } catch (e) { alert("Erro ao salvar"); }
        }

        setInterval(buscarDados, 3000);
        buscarDados();
    </script>
</body>
</html>
