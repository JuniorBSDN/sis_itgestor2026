<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BioControl Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #0b111a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-color: #00f2ff;
            --secondary-accent: #7000ff;
            --text-color: #ffffff;
            --danger: #ff4d4d;
            --success: #2ecc71;
            --modal-bg: #151d29;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; justify-content: center;
            min-height: 100vh; padding: 15px;
        }

        .container { width: 100%; max-width: 400px; }

        header { margin-bottom: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        header h1 { font-size: 1.1rem; color: var(--accent-color); letter-spacing: 3px; font-weight: 300; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px; margin-bottom: 25px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.7rem; text-transform: uppercase; opacity: 0.6; }

        select, input {
            width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: white; font-size: 1rem;
        }

        .btn-submit {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            color: #000; font-weight: 700; font-size: 1rem; cursor: pointer;
            background: linear-gradient(135deg, var(--accent-color), var(--secondary-accent));
        }

        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .filter-date { padding: 7px; font-size: 0.8rem; background: rgba(255,255,255,0.07); color: white; border: none; border-radius: 8px; }
        .btn-pdf { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; padding: 7px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; }

        .history-item {
            background: var(--card-bg); padding: 15px; border-radius: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--accent-color); cursor: pointer;
        }

        .item-info strong { display: block; font-size: 0.95rem; }
        .item-info span { font-size: 0.75rem; opacity: 0.5; }
        .item-weight { color: var(--accent-color); font-weight: 600; font-size: 1.1rem; }

        /* Modal Action Sheet */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 1000;
        }
        .action-sheet {
            background: var(--modal-bg); width: 100%; max-width: 400px;
            border-radius: 25px 25px 0 0; padding: 20px;
        }
        .action-btn {
            width: 100%; padding: 18px; background: rgba(255,255,255,0.05);
            border: none; border-radius: 15px; color: white; font-size: 1rem;
            margin-bottom: 10px; text-align: left; font-weight: 600;
        }
        .action-btn.edit { border-left: 4px solid var(--success); color: var(--success); }
        .action-btn.delete { border-left: 4px solid var(--danger); color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>BIOCONTROL PRO</h1></header>

    <div class="glass-card">
        <input type="hidden" id="edit-id">
        <div class="form-group">
            <label>Tipo de Lixo</label>
            <select id="tipo">
                <option>Infectante (A)</option>
                <option>Químico (B)</option>
                <option>Comum (D)</option>
                <option>Perfurocortante (E)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Quantidade (Kg)</label>
            <input type="number" id="peso" placeholder="0.00" inputmode="decimal">
        </div>
        <button class="btn-submit" id="btn-salvar" onclick="salvarRegistro()">SALVAR REGISTRO</button>
    </div>

    <div class="history-header">
        <input type="date" id="filtroData" class="filter-date" onchange="renderLista()">
        <button class="btn-pdf" onclick="gerarPDF()">PDF</button>
    </div>

    <div id="lista"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target==this) fecharModal()">
    <div class="action-sheet">
        <button class="action-btn edit" onclick="prepararEdicao()">✏️ Alterar Registro</button>
        <button class="action-btn delete" onclick="excluirRegistro()">🗑️ Excluir Registro</button>
        <button class="action-btn" onclick="fecharModal()" style="text-align:center; opacity:0.5">Cancelar</button>
    </div>
</div>

<script>
    const API_URL = '/api/residuos';
    let idParaAcao = null;
    let registrosLocais = [];

    document.getElementById('filtroData').valueAsDate = new Date();

    async function renderLista() {
        const data = document.getElementById('filtroData').value;
        const listaDiv = document.getElementById('lista');
        listaDiv.innerHTML = '<p style="text-align:center; opacity:0.5">Carregando...</p>';

        try {
            const res = await fetch(`${API_URL}?data=${data}`);
            registrosLocais = await res.json();
            
            listaDiv.innerHTML = '';
            if (registrosLocais.length === 0) {
                listaDiv.innerHTML = '<p style="text-align:center; opacity:0.3">Nenhum registro.</p>';
                return;
            }

            registrosLocais.forEach(r => {
                listaDiv.innerHTML += `
                    <div class="history-item" onclick="abrirModal('${r.id}')">
                        <div class="item-info">
                            <strong>${r.tipo}</strong>
                            <span>${r.data_registro.split(' ')[1]}</span>
                        </div>
                        <div class="item-weight">${r.peso} kg</div>
                    </div>`;
            });
        } catch (e) { console.error(e); }
    }

    async function salvarRegistro() {
        const id = document.getElementById('edit-id').value;
        const payload = {
            tipo: document.getElementById('tipo').value,
            peso: parseFloat(document.getElementById('peso').value).toFixed(2),
            data_busca: document.getElementById('filtroData').value
        };

        const method = id ? 'PATCH' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        const res = await fetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            document.getElementById('edit-id').value = '';
            document.getElementById('peso').value = '';
            document.getElementById('btn-salvar').textContent = "SALVAR REGISTRO";
            document.getElementById('btn-salvar').style.background = "";
            renderLista();
        }
    }

    function abrirModal(id) { idParaAcao = id; document.getElementById('modalOverlay').style.display = 'flex'; }
    function fecharModal() { document.getElementById('modalOverlay').style.display = 'none'; }

    function prepararEdicao() {
        const r = registrosLocais.find(item => item.id === idParaAcao);
        document.getElementById('tipo').value = r.tipo;
        document.getElementById('peso').value = r.peso;
        document.getElementById('edit-id').value = r.id;
        document.getElementById('btn-salvar').textContent = "ATUALIZAR";
        document.getElementById('btn-salvar').style.background = "var(--success)";
        fecharModal();
        window.scrollTo(0,0);
    }

    async function excluirRegistro() {
        if (!confirm("Excluir?")) return;
        await fetch(`${API_URL}/${idParaAcao}`, { method: 'DELETE' });
        fecharModal();
        renderLista();
    }

    function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const data = document.getElementById('filtroData').value;
        doc.text(`Relatório de Resíduos - ${data}`, 10, 10);
        let y = 20;
        let total = 0;
        registrosLocais.forEach(r => {
            doc.text(`${r.data_registro.split(' ')[1]} - ${r.tipo}: ${r.peso}kg`, 10, y);
            total += parseFloat(r.peso);
            y += 10;
        });
        doc.text(`Total: ${total.toFixed(2)}kg`, 10, y + 5);
        doc.save(`residuos_${data}.pdf`);
    }

    renderLista();
</script>
</body>
</html>
