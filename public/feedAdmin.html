<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Indicadores - Ouvidoria Hospitalar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 md:p-8">

    <header class="max-w-7xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-800 pb-6 mb-8 gap-4">
        <div>
            <div class="flex items-center gap-2 text-xs uppercase tracking-widest text-cyan-500 font-bold mb-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                Sincronizado com API Python & Firestore
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">Análise de Satisfação Hospitalar</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto space-y-6">
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Total de Votos</div>
                <div id="kpi-total" class="text-4xl font-black text-white mt-2">0</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Média de Satisfação</div>
                <div id="kpi-media" class="text-4xl font-black text-cyan-400 mt-2">0.0 / 5.0</div>
            </div>
            <div id="card-alerta" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl transition-all">
                <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Status Operacional</div>
                <div id="kpi-status" class="text-xl font-bold text-emerald-400 mt-3">Todos os setores estáveis</div>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4">Volume de Notas por Classificação</h3>
                <div class="relative h-64 w-full">
                    <canvas id="graficoNotas"></canvas>
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4">Média por Setor Hospitalar</h3>
                <div class="relative h-64 w-full">
                    <canvas id="graficoSetores"></canvas>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Endpoint relativo apontando para a API Python unificada
        const URL_API_GET = "/api/indicadores";
        
        // Configuração global de estilo do Chart.js para combinar com o tema Matrix/Ciano
        Chart.defaults.color = '#64748b';
        Chart.defaults.font.family = 'ui-sans-serif, system-ui, sans-serif';

        let chartNotas = null;
        let chartSetores = null;

        async function carregarDashboard() {
            try {
                const res = await fetch(URL_API_GET);
                if (!res.ok) throw new Error("Falha ao buscar indicadores");
                
                const dados = await res.json();

                // 1. Atualiza os cards estáticos
                document.getElementById('kpi-total').innerText = dados.total_votos || 0;
                document.getElementById('kpi-media').innerText = (dados.media_geral ? dados.media_geral.toFixed(1) : "0.0") + " / 5.0";

                // 2. Sistema de Alerta Operacional Automático
                const boxAlerta = document.getElementById('card-alerta');
                const txtAlerta = document.getElementById('kpi-status');
                let temSetorCritico = false;

                if (dados.setores) {
                    for (const setor in dados.setores) {
                        const s = dados.setores[setor];
                        if (s.votos > 0 && s.media < 3.0) {
                            boxAlerta.className = "bg-red-950/40 border border-red-900 p-6 rounded-2xl shadow-xl transition-all";
                            txtAlerta.className = "text-xl font-bold text-red-400 mt-3";
                            txtAlerta.innerText = `Atenção Crítica: ${setor}`;
                            temSetorCritico = true;
                            break;
                        }
                    }
                }

                if (!temSetorCritico) {
                    boxAlerta.className = "bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl transition-all";
                    txtAlerta.className = "text-xl font-bold text-emerald-400 mt-3";
                    txtAlerta.innerText = "Todos os setores estáveis";
                }

                // 3. Renderização Dinâmica do Gráfico de Classificação de Votos
                const ctxNotas = document.getElementById('graficoNotas').getContext('2d');
                const labelsNotas = ["Péssimo", "Ruim", "Regular", "Bom", "Excelente"];
                const valoresNotas = labelsNotas.map(label => dados.distribuicao_notas?.[label] || 0);

                if (chartNotas) chartNotas.destroy();
                chartNotas = new Chart(ctxNotas, {
                    type: 'bar',
                    data: {
                        labels: labelsNotas,
                        datasets: [{
                            label: 'Quantidade de Votos',
                            data: valoresNotas,
                            backgroundColor: '#22d3ee', // Ciano Neon
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#1e293b' } },
                            x: { grid: { display: false } }
                        }
                    }
                });

                // 4. Renderização Dinâmica do Gráfico de Média por Setor
                const ctxSetores = document.getElementById('graficoSetores').getContext('2d');
                const labelsSetores = ["Pronto Atendimento", "Ambulatório", "Exames e Laboratório", "Internação"];
                const valoresSetores = labelsSetores.map(setor => dados.setores?.[setor]?.media || 0);

                if (chartSetores) chartSetores.destroy();
                chartSetores = new Chart(ctxSetores, {
                    type: 'bar',
                    data: {
                        labels: ['P.A.', 'Ambulatório', 'Exames', 'Internação'],
                        datasets: [{
                            data: valoresSetores,
                            backgroundColor: ['#ef4444', '#34d399', '#22d3ee', '#a78bfa'],
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { min: 0, max: 5, grid: { color: '#1e293b' } },
                            x: { grid: { display: false } }
                        }
                    }
                });

            } catch (err) {
                console.error("Erro ao atualizar o dashboard da Ouvidoria:", err);
            }
        }

        // Inicialização imediata e loop de atualização em tempo real (a cada 10 segundos)
        carregarDashboard();
        setInterval(carregarDashboard, 10000);
    </script>
</body>
</html>
