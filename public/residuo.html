<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor-HVN | Registro com Excel Automático</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --hvn-primary: #2563eb; --hvn-secondary: #64748b; --hvn-success: #10b981;
            --hvn-bg: #f8fafc; --sidebar: #0f172a; --white: #ffffff; --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--hvn-bg); display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: var(--sidebar); color: white; padding: 2rem; position: fixed; height: 100vh; }
        .main-content { margin-left: 260px; width: calc(100% - 260px); padding: 2.5rem; }

        .card { background: var(--white); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 1rem; text-align: left; font-size: 0.75rem; color: var(--hvn-secondary); border-bottom: 1px solid var(--border); }
        td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

        .btn-main { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; background: var(--hvn-primary); color: white; display: flex; align-items: center; gap: 8px; }
        .btn-excel { background: var(--hvn-success); margin-left: 10px; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 20px; width: 450px; }

        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <h3>GESTOR HVN</h3>
    <p style="font-size: 0.7rem; color: #64748b;">Excel Automático Ativado</p>
</aside>

<main class="main-content">
    <header style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
        <h1>Registros da Unidade</h1>
        <div style="display: flex;">
            <button class="btn-main" onclick="abrirModal()"><i class="fas fa-plus"></i> Novo Registro</button>
            <button class="btn-main btn-excel" onclick="baixarExcel()"><i class="fas fa-file-excel"></i> Baixar Atual</button>
        </div>
    </header>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Função</th>
                    <th>Turno</th>
                </tr>
            </thead>
            <tbody id="lista-corpo"></tbody>
        </table>
    </div>
</main>

<div id="modalForm" class="modal">
    <div class="modal-content">
        <h2>Novo Funcionário</h2>
        <input type="text" id="f-nome" placeholder="Nome Completo">
        <input type="text" id="f-tel" placeholder="Telefone">
        <select id="f-funcao">
            <option value="Enfermagem">Enfermagem</option>
            <option value="Médico(a)">Médico(a)</option>
            <option value="Administrativo">Administrativo</option>
        </select>
        <select id="f-turno">
            <option value="12x36">12x36</option>
            <option value="Comercial">Comercial</option>
        </select>
        <button class="btn-main" style="width: 100%; justify-content: center;" onclick="salvarERegistrar()">Salvar e Gerar Excel</button>
        <button onclick="fecharModal()" style="width:100%; background:none; border:none; margin-top:10px; cursor:pointer;">Cancelar</button>
    </div>
</div>

<script>
    let funcionarios = [];

    function abrirModal() { document.getElementById('modalForm').style.display = 'flex'; }
    function fecharModal() { document.getElementById('modalForm').style.display = 'none'; }

    function salvarERegistrar() {
        const nome = document.getElementById('f-nome').value;
        const tel = document.getElementById('f-tel').value;
        const funcao = document.getElementById('f-funcao').value;
        const turno = document.getElementById('f-turno').value;

        if(!nome || !tel) return alert("Preencha os dados!");

        // 1. Adiciona ao Array
        funcionarios.push({
            Nome: nome,
            Telefone: tel,
            Função: funcao,
            Turno: turno,
            Data_Registro: new Date().toLocaleString()
        });

        // 2. Atualiza a Tabela na Tela
        renderizar();

        // 3. FECHA MODAL E GERA EXCEL AUTOMATICAMENTE
        fecharModal();
        baixarExcel();

        // Limpa campos
        document.getElementById('f-nome').value = "";
        document.getElementById('f-tel').value = "";
    }

    function renderizar() {
        const corpo = document.getElementById('lista-corpo');
        corpo.innerHTML = funcionarios.map(f => `
            <tr>
                <td><strong>${f.Nome}</strong></td>
                <td>${f.Telefone}</td>
                <td>${f.Função}</td>
                <td>${f.Turno}</td>
            </tr>
        `).join('');
    }

    // FUNÇÃO PARA GERAR O ARQUIVO EXCEL
    function baixarExcel() {
        if(funcionarios.length === 0) return;

        // Cria uma "folha" (worksheet) a partir do nosso array de objetos
        const worksheet = XLSX.utils.json_to_sheet(funcionarios);

        // Cria um "livro" (workbook)
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Funcionários");

        // Gera o arquivo e inicia o download automático
        XLSX.writeFile(workbook, "Registros_Gestor_HVN.xlsx");
    }
</script>

</body>
</html>
