<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BioControl Pro - Gestão Local</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #0b111a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-color: #00f2ff;
            --secondary-accent: #7000ff;
            --text-color: #ffffff;
            --danger: #ff4d4d;
            --success: #2ecc71;
            --modal-bg: #151d29;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; justify-content: center;
            min-height: 100vh; padding: 15px;
        }

        .container { width: 100%; max-width: 400px; }

        header { margin-bottom: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        header h1 { font-size: 1.1rem; color: var(--accent-color); letter-spacing: 3px; font-weight: 300; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px; margin-bottom: 25px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.7rem; text-transform: uppercase; opacity: 0.6; }

        select, input {
            width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: white; font-size: 1rem; outline: none;
        }

        .btn-submit {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            color: #000; font-weight: 700; font-size: 1rem; cursor: pointer;
            background: linear-gradient(135deg, var(--accent-color), var(--secondary-accent));
        }

        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .filter-date { padding: 7px; font-size: 0.8rem; background: rgba(255,255,255,0.07); color: white; border: none; border-radius: 8px; }
        .btn-excel { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; padding: 7px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }

        .history-item {
            background: var(--card-bg); padding: 15px; border-radius: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--accent-color); cursor: pointer;
            transition: 0.2s;
        }
        .history-item:active { transform: scale(0.98); background: rgba(255,255,255,0.1); }

        .item-info strong { display: block; font-size: 0.95rem; }
        .item-info span { font-size: 0.75rem; opacity: 0.5; }
        .item-weight { color: var(--accent-color); font-weight: 600; font-size: 1.1rem; }

        /* Modal de Ações */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 1000;
        }
        .action-sheet {
            background: var(--modal-bg); width: 100%; max-width: 400px;
            border-radius: 25px 25px 0 0; padding: 20px; animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .action-btn {
            width: 100%; padding: 18px; background: rgba(255,255,255,0.05);
            border: none; border-radius: 15px; color: white; font-size: 1rem;
            margin-bottom: 10px; text-align: left; font-weight: 600; cursor: pointer;
        }
        .action-btn.edit { border-left: 4px solid var(--success); color: var(--success); }
        .action-btn.delete { border-left: 4px solid var(--danger); color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>JOYCE</h1>
        <p style="font-size: 0.7rem; opacity: 0.5; letter-spacing: 2px;">BIOCONTROL PRO</p>
    </header>

    <div class="glass-card">
        <input type="hidden" id="edit-id">
        <div class="form-group">
            <label>Tipo de Lixo</label>
            <select id="tipo">
                <option>Infectante (A)</option>
                <option>Químico (B)</option>
                <option>Comum (D)</option>
                <option>Perfurocortante (E)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Quantidade (Kg)</label>
            <input type="number" id="peso" placeholder="0.00" inputmode="decimal" step="0.01">
        </div>
        <button class="btn-submit" id="btn-salvar" onclick="salvarRegistro()">SALVAR REGISTRO</button>
    </div>

    <div class="history-header">
        <input type="date" id="filtroData" class="filter-date" onchange="renderLista()">
        <button class="btn-excel" onclick="baixarExcel()">BAIXAR EXCEL</button>
    </div>

    <div id="lista"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target==this) fecharModal()">
    <div class="action-sheet">
        <button class="action-btn edit" onclick="prepararEdicao()">✏️ Alterar Registro</button>
        <button class="action-btn delete" onclick="excluirRegistro()">🗑️ Excluir Registro</button>
        <button class="action-btn" onclick="fecharModal()" style="text-align:center; opacity:0.5">Cancelar</button>
    </div>
</div>

<script>
    const STORAGE_KEY = 'biocontrol_v3';
    let idParaAcao = null;

    document.getElementById('filtroData').valueAsDate = new Date();

    function salvarRegistro() {
        const idEdicao = document.getElementById('edit-id').value;
        const tipo = document.getElementById('tipo').value;
        const peso = document.getElementById('peso').value;
        const dataSelecionada = document.getElementById('filtroData').value;

        if (!peso) return alert("Insira o peso!");

        let registros = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        if (idEdicao) {
            // Modo Edição
            const index = registros.findIndex(r => r.id == idEdicao);
            if (index !== -1) {
                registros[index].tipo = tipo;
                registros[index].peso = parseFloat(peso).toFixed(2);
            }
        } else {
            // Novo Registro
            const novo = {
                id: Date.now(),
                tipo: tipo,
                peso: parseFloat(peso).toFixed(2),
                data: dataSelecionada,
                hora: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
            };
            registros.push(novo);
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
        resetarFormulario();
        renderLista();
    }

    function renderLista() {
        const listaDiv = document.getElementById('lista');
        const dataFiltro = document.getElementById('filtroData').value;
        const registros = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        const filtrados = registros.filter(r => r.data === dataFiltro);
        listaDiv.innerHTML = '';

        if (filtrados.length === 0) {
            listaDiv.innerHTML = '<p style="text-align:center; opacity:0.3; padding:20px;">Sem registros.</p>';
            return;
        }

        filtrados.reverse().forEach(r => {
            listaDiv.innerHTML += `
                <div class="history-item" onclick="abrirModal(${r.id})">
                    <div class="item-info">
                        <strong>${r.tipo}</strong>
                        <span>${r.hora}</span>
                    </div>
                    <div class="item-weight">${r.peso} kg</div>
                </div>`;
        });
    }

    function abrirModal(id) {
        idParaAcao = id;
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }

    function prepararEdicao() {
        const registros = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const registro = registros.find(r => r.id == idParaAcao);

        document.getElementById('edit-id').value = registro.id;
        document.getElementById('tipo').value = registro.tipo;
        document.getElementById('peso').value = registro.peso;

        const btn = document.getElementById('btn-salvar');
        btn.textContent = "ATUALIZAR DADOS";
        btn.style.background = "var(--success)";

        fecharModal();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function excluirRegistro() {
        if (!confirm("Deseja realmente excluir?")) return;
        let registros = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        registros = registros.filter(r => r.id != idParaAcao);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
        fecharModal();
        renderLista();
    }

    function resetarFormulario() {
        document.getElementById('edit-id').value = '';
        document.getElementById('peso').value = '';
        const btn = document.getElementById('btn-salvar');
        btn.textContent = "SALVAR REGISTRO";
        btn.style.background = "";
    }

    function baixarExcel() {
        const registros = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (registros.length === 0) return alert("Nada para exportar.");

        const dadosExcel = registros.map(r => ({
            "Data": r.data,
            "Hora": r.hora,
            "Tipo": r.tipo,
            "Peso (Kg)": parseFloat(r.peso)
        }));

        const ws = XLSX.utils.json_to_sheet(dadosExcel);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "BioControl");
        XLSX.writeFile(wb, "BioControl_Geral.xlsx");
    }

    renderLista();
</script>

</body>
</html>
