<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BioControl Pro - Gestão Local</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg-color: #0b111a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-color: #00f2ff;
            --secondary-accent: #7000ff;
            --text-color: #ffffff;
            --danger: #ff4d4d;
            --success: #2ecc71;
            --modal-bg: #151d29;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; justify-content: center;
            min-height: 100vh; padding: 15px;
        }

        .container { width: 100%; max-width: 400px; }

        header { margin-bottom: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        header h1 { font-size: 1.1rem; color: var(--accent-color); letter-spacing: 3px; font-weight: 300; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px; margin-bottom: 25px;
        }

        .total-card {
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(112, 0, 255, 0.1));
            border: 1px solid var(--accent-color);
            border-radius: 15px; padding: 15px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .total-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
        .total-value { font-size: 1.4rem; font-weight: 600; color: var(--accent-color); }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.7rem; text-transform: uppercase; opacity: 0.6; }

        select, input {
            width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: white; font-size: 1rem; outline: none;
        }

        .btn-submit {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            color: #000; font-weight: 700; font-size: 1rem; cursor: pointer;
            background: linear-gradient(135deg, var(--accent-color), var(--secondary-accent));
        }

        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 8px; }
        .filter-date { flex: 1; padding: 7px; font-size: 0.8rem; background: rgba(255,255,255,0.07); color: white; border: none; border-radius: 8px; }
        
        .btn-action { padding: 8px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; cursor: pointer; border: 1px solid; }
        .btn-excel { background: rgba(46, 204, 113, 0.1); color: #2ecc71; border-color: #2ecc71; }
        .btn-pdf { background: rgba(231, 76, 60, 0.1); color: #e74c3c; border-color: #e74c3c; }

        .history-item {
            background: var(--card-bg); padding: 15px; border-radius: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--accent-color); cursor: pointer;
        }

        .item-info strong { display: block; font-size: 0.95rem; }
        .item-info span { font-size: 0.75rem; opacity: 0.5; }
        .item-weight { color: var(--accent-color); font-weight: 600; font-size: 1.1rem; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 1000;
        }
        .action-sheet {
            background: var(--modal-bg); width: 100%; max-width: 400px;
            border-radius: 25px 25px 0 0; padding: 20px; animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .action-btn {
            width: 100%; padding: 18px; background: rgba(255,255,255,0.05);
            border: none; border-radius: 15px; color: white; font-size: 1rem;
            margin-bottom: 10px; text-align: left; font-weight: 600; cursor: pointer;
        }
        .action-btn.edit { border-left: 4px solid var(--success); color: var(--success); }
        .action-btn.delete { border-left: 4px solid var(--danger); color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>JOYCE</h1>
        <p style="font-size: 0.7rem; opacity: 0.5; letter-spacing: 2px;">BIOCONTROL PRO</p>
    </header>

    <div class="glass-card">
        <input type="hidden" id="edit-id">
        <div class="form-group">
            <label>Tipo de Lixo</label>
            <select id="tipo">
                <option>Infectante (A)</option>
                <option>Químico (B)</option>
                <option>Comum (D)</option>
                <option>Perfurocortante (E)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Quantidade (Kg)</label>
            <input type="number" id="peso" placeholder="0.00" inputmode="decimal" step="0.01">
        </div>
        <button class="btn-submit" id="btn-salvar" onclick="salvarRegistro()">SALVAR REGISTRO</button>
    </div>

    <div id="resumo-dia"></div>

    <div class="history-header">
        <input type="date" id="filtroData" class="filter-date" onchange="renderLista()">
        <button class="btn-action btn-excel" onclick="baixarExcel()">EXCEL</button>
        <button class="btn-action btn-pdf" onclick="gerarPDF()">PDF</button>
    </div>

    <div id="lista"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target==this) fecharModal()">
    <div class="action-sheet">
        <button class="action-btn edit" onclick="prepararEdicao()">✏️ Alterar Registro</button>
        <button class="action-btn delete" onclick="excluirRegistro()">🗑️ Excluir Registro</button>
        <button class="action-btn" onclick="fecharModal()" style="text-align:center; opacity:0.5">Cancelar</button>
    </div>
</div>

<script>
    const STORAGE_KEY = 'biocontrol_v3';
    let idParaAcao = null;
    let filtradosGlobal = [];

    document.getElementById('filtroData').valueAsDate = new Date();

    function salvarRegistro() {
        const idEdicao = document.getElementById('edit-id').value;
        const tipo = document.getElementById('tipo').value;
        const peso = document.getElementById('peso').value;
        const dataSelecionada = document.getElementById('filtroData').value;

        if (!peso) return alert("Insira o peso!");

        let registros = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        if (idEdicao) {
            const index = registros.findIndex(r => r.id == idEdicao);
            if (index !== -1) {
                registros[index].tipo = tipo;
                registros[index].peso = parseFloat(peso).toFixed(2);
            }
        } else {
            const novo = {
                id: Date.now(),
                tipo: tipo,
                peso: parseFloat(peso).toFixed(2),
                data: dataSelecionada,
                hora: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
            };
            registros.push(novo);
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
        resetarFormulario();
        renderLista();
    }

    function renderLista() {
        const listaDiv = document.getElementById('lista');
        const resumoDiv = document.getElementById('resumo-dia');
        const dataFiltro = document.getElementById('filtroData').value;
        const registros = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        filtradosGlobal = registros.filter(r => r.data === dataFiltro);
        listaDiv.innerHTML = '';
        resumoDiv.innerHTML = '';

        if (filtradosGlobal.length === 0) {
            listaDiv.innerHTML = '<p style="text-align:center; opacity:0.3; padding:20px;">Sem registros.</p>';
            return;
        }

        let somaTotal = 0;
        filtradosGlobal.slice().reverse().forEach(r => {
            somaTotal += parseFloat(r.peso);
            listaDiv.innerHTML += `
                <div class="history-item" onclick="abrirModal(${r.id})">
                    <div class="item-info">
                        <strong>${r.tipo}</strong>
                        <span>${r.hora}</span>
                    </div>
                    <div class="item-weight">${r.peso} kg</div>
                </div>`;
        });

        resumoDiv.innerHTML = `
            <div class="total-card">
                <span class="total-label">Total do Dia</span>
                <span class="total-value">${somaTotal.toFixed(2)} Kg</span>
            </div>`;
    }

    function abrirModal(id) { idParaAcao = id; document.getElementById('modalOverlay').style.display = 'flex'; }
    function fecharModal() { document.getElementById('modalOverlay').style.display = 'none'; }

    function prepararEdicao() {
        const registros = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const r = registros.find(r => r.id == idParaAcao);
        document.getElementById('edit-id').value = r.id;
        document.getElementById('tipo').value = r.tipo;
        document.getElementById('peso').value = r.peso;
        const btn = document.getElementById('btn-salvar');
        btn.textContent = "ATUALIZAR DADOS";
        btn.style.background = "var(--success)";
        fecharModal();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function excluirRegistro() {
        if (!confirm("Excluir?")) return;
        let registros = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        registros = registros.filter(r => r.id != idParaAcao);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
        fecharModal();
        renderLista();
    }

    function resetarFormulario() {
        document.getElementById('edit-id').value = '';
        document.getElementById('peso').value = '';
        const btn = document.getElementById('btn-salvar');
        btn.textContent = "SALVAR REGISTRO";
        btn.style.background = "";
    }

    function gerarPDF() {
        if (filtradosGlobal.length === 0) return alert("Sem dados.");
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const dataFiltro = document.getElementById('filtroData').value;

        doc.setFontSize(18);
        doc.text("JOYCE - BIOCONTROL PRO", 14, 15);
        doc.setFontSize(10);
        doc.text(`Relatório: ${dataFiltro.split('-').reverse().join('/')}`, 14, 22);

        const colunas = ["Hora", "Tipo", "Peso (Kg)"];
        const linhas = filtradosGlobal.map(r => [r.hora, r.tipo, r.peso]);
        
        const total = filtradosGlobal.reduce((acc, curr) => acc + parseFloat(curr.peso), 0);
        linhas.push([{ content: 'TOTAL DO DIA', colSpan: 2, styles: { halign: 'right', fontStyle: 'bold' } }, { content: total.toFixed(2) + ' kg', styles: { fontStyle: 'bold' } }]);

        doc.autoTable({
            head: [colunas],
            body: linhas,
            startY: 30,
            theme: 'striped',
            headStyles: { fillColor: [112, 0, 255] }
        });

        doc.save(`BioControl_${dataFiltro}.pdf`);
    }

    function baixarExcel() {
        if (filtradosGlobal.length === 0) return alert("Sem dados.");
        const dados = filtradosGlobal.map(r => ({ "Data": r.data, "Hora": r.hora, "Tipo": r.tipo, "Peso": r.peso }));
        const ws = XLSX.utils.json_to_sheet(dados);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "BioControl");
        XLSX.writeFile(wb, "BioControl_Filtrado.xlsx");
    }

    renderLista();
</script>
</body>
</html>
