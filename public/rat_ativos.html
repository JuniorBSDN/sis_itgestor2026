<script>
    let ativosCache = [];

    async function buscarDados() {
      try {
        // 1. CORREÇÃO: Rota correta definida no seu api/index.py
        const res = await fetch('/api/ativos');
        
        if (!res.ok) throw new Error("Erro ao buscar dados do servidor");

        // 2. CORREÇÃO: O Python retorna a lista direta [{}, {}], não {status: 'sucesso', ativos: []}
        const data = await res.json();
        
        ativosCache = data; // Atribui a lista diretamente
        renderizar(ativosCache);
        
      } catch (e) {
        console.error("Erro ao carregar dados:", e);
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = `<tr><td colspan="9" class="text-center p-10 text-red-400">Erro ao carregar dados da API. Verifique o console.</td></tr>`;
      }
    }

    function renderizar(lista) {
      const tbody = document.getElementById('corpoTabela');
      
      if (!lista || lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center p-10 text-slate-500">Nenhum ativo cadastrado no sistema.</td></tr>`;
        return;
      }

      tbody.innerHTML = lista.map(a => `
        <tr>
          <td class="td-custom">
            <span class="font-bold text-white block">${a.usuario || '--'}</span>
            <span class="text-slate-400 text-[10px]">${a.setor || '--'}</span>
          </td>
          <td class="td-custom font-bold text-blue-400">${a.id_ativo || '--'}</td>
          <td class="td-custom">
            <span class="block">${a.equipamento || '--'}</span>
            <span class="text-slate-400 text-[10px]">${a.modelo || '--'}</span>
          </td>
          <td class="td-custom">
            <span class="block text-[10px]">S: ${a.ns_serial || '--'}</span>
            <span class="block text-[10px]">P: ${a.patrimonio || '--'}</span>
          </td>
          <td class="td-custom">
            <span class="block text-[10px]">H: ${a.hardware || '--'}</span>
            <span class="block text-[10px] text-blue-300">S: ${a.software || '--'}</span>
          </td>
          <td class="td-custom font-mono">
            <span class="block text-yellow-500 text-[10px]">ID: ${a.id_suporte || '--'}</span>
            <span class="text-[10px]">${a.ipv4 || '--'}</span>
          </td>
          <td class="td-custom font-mono text-blue-300 text-[10px]">
            ${a.hostname || a.nome_computador || '--'}
          </td>
          <td class="td-custom">
            <span class="block font-bold text-[9px] uppercase">${a.status_fisico || '--'}</span>
            <span class="text-emerald-400 text-[8px] italic">${Array.isArray(a.itens_requeridos) ? a.itens_requeridos.join(', ') : '--'}</span>
          </td>
          <td class="td-custom text-[10px] text-slate-400 italic">
            ${a.obs || '--'}
          </td>
        </tr>
      `).join('');
    }

    function prepararImpressao() {
      document.getElementById('data-atual').innerText = new Date().toLocaleString('pt-BR');
      window.print();
    }

    function filtrarTabela() {
      const termo = document.getElementById('filtro').value.toLowerCase();
      const filtrados = ativosCache.filter(a =>
        // Busca em todos os campos do objeto
        Object.values(a).some(v => String(v).toLowerCase().includes(termo))
      );
      renderizar(filtrados);
    }

    // Inicializa a busca ao carregar a página
    document.addEventListener('DOMContentLoaded', buscarDados);
  </script>
