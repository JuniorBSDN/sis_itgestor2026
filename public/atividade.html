<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Chamado T.I.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .modal { transition: opacity 0.25s ease; }
    body.modal-active { overflow: hidden; }
    input:focus, textarea:focus, select:focus { border-color: #3b82f6 !important; }
  </style>
</head>
<body class="bg-slate-900 text-white p-2 md:p-6">
  
  <div class="max-w-4xl mx-auto bg-slate-800 p-4 md:p-8 rounded-3xl border border-slate-700 shadow-2xl relative">
    
    <button onclick="abrirModal()" class="absolute top-4 right-4 md:top-8 md:right-8 text-slate-400 hover:text-blue-400 transition-all bg-slate-700/50 p-2 rounded-full" title="Buscar Atendimento">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </button>

    <h2 id="titulo-form" class="text-xl md:text-2xl font-bold mb-8 border-b border-slate-700 pb-4 text-blue-400 pr-10">
      Registro de Atendimento Técnico
    </h2>

    <form id="formAtividade" class="space-y-6">
      <input type="hidden" id="doc_id_atual">

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Solicitante</label>
          <input type="text" id="solicitante" required class="w-full bg-slate-900/50 p-3 rounded-xl border border-slate-600 outline-none transition-all">
        </div>
        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Telefone/Ramal</label>
          <input type="text" id="telefone" required class="w-full bg-slate-900/50 p-3 rounded-xl border border-slate-600 outline-none transition-all">
        </div>
        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Setor</label>
          <input type="text" id="setor" required class="w-full bg-slate-900/50 p-3 rounded-xl border border-slate-600 outline-none transition-all">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Status do Chamado</label>
          <select id="status_atendimento" onchange="verificarStatus()" class="w-full bg-slate-900/50 p-3 rounded-xl border border-slate-600 outline-none cursor-pointer">
            <option value="Concluído">✅ Concluído com Sucesso</option>
            <option value="Retorno">🔄 Retorno/Reincidência</option>
            <option value="Improdutivo">⚠️ Improdutivo (Falta de Recurso)</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">ID do Ativo</label>
          <input type="text" id="ativo_id" placeholder="Ex: PC-TI-01" class="w-full bg-slate-900/50 p-3 rounded-xl border border-slate-600 outline-none transition-all">
        </div>
      </div>

      <div id="campo_justificativa" class="hidden animate-pulse">
        <label id="label_justificativa" class="block text-[10px] font-bold uppercase mb-1"></label>
        <textarea id="motivo_detalhado" rows="2" class="w-full bg-slate-900/50 p-3 rounded-xl border border-slate-600 outline-none text-sm"></textarea>
      </div>

      <div class="space-y-4">
        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Problema Relatado</label>
          <textarea id="descricao" rows="2" required class="w-full bg-slate-900/50 p-3 rounded-xl border border-slate-600 outline-none text-sm" placeholder="O que o usuário informou?"></textarea>
        </div>
        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Solução ou Ação Tomada</label>
          <textarea id="solucao" rows="2" required class="w-full bg-slate-900 p-3 rounded-xl border border-emerald-500/30 outline-none text-sm shadow-inner" placeholder="O que foi feito para resolver?"></textarea>
        </div>
      </div>

      <div class="flex flex-col md:flex-row gap-3 pt-4">
        <button type="submit" id="btn-salvar" class="flex-1 bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold uppercase tracking-widest text-xs transition-all shadow-lg shadow-blue-900/20">
          Salvar Registro
        </button>
        <button type="button" id="btn-excluir" onclick="excluirRegistro()" class="hidden bg-red-600 hover:bg-red-500 py-4 px-8 rounded-2xl font-bold uppercase text-xs transition-all">
          Excluir
        </button>
        <button type="button" id="btn-cancelar" onclick="limparFormulario()" class="hidden bg-slate-600 hover:bg-slate-500 py-4 px-8 rounded-2xl font-bold uppercase text-xs transition-all">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <div id="modalBusca" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50 p-4">
    <div class="modal-overlay absolute w-full h-full bg-black/80 backdrop-blur-sm" onclick="fecharModal()"></div>
    <div class="modal-container bg-slate-800 w-full max-w-2xl mx-auto rounded-3xl shadow-2xl z-50 overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800">
        <h3 class="text-lg font-bold">Buscar Atendimento</h3>
        <button onclick="fecharModal()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
      </div>
      <div class="p-6 bg-slate-800 overflow-y-auto">
        <input type="text" id="filtroModal" onkeyup="filtrarLista()" placeholder="Filtrar por nome ou setor..." class="w-full bg-slate-900 p-4 rounded-2xl mb-4 outline-none border border-slate-700 focus:border-blue-500">
        <div id="listaAtendimentos" class="space-y-3">
          </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('formAtividade').onsubmit = async (e) => {
    e.preventDefault();
    const dados = {
        tecnico: document.getElementById('tecnico').value,
        setor: document.getElementById('setor').value,
        status: document.getElementById('status_atendimento').value,
        id_ativo: document.getElementById('ativo_id').value,
        descricao: document.getElementById('descricao').value,
        solucao: document.getElementById('solucao').value,
        justificativa: document.getElementById('motivo_detalhado').value
    };

    try {
        const res = await fetch('/api/atividades', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(dados)
        });

        if(res.ok) {
            alert("Atividade registrada com sucesso!");
            location.reload();
        }
    } catch (error) {
        alert("Erro: " + error.message);
    }
};
  </script>
</body>
</html>
