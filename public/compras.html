<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kleber v.1 | Lista de Compras</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --accents-1: #111111;
            --accents-2: #333333;
            --text: #ffffff;
            --gray: #888888;
            --blue: #0070f3;
            --red: #ff4d4d;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 500px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.05rem; }
        .version {
            background: #fff; color: #000;
            padding: 2px 6px; border-radius: 4px;
            font-size: 0.6rem; margin-left: 5px;
        }

        .user-box {
            margin-bottom: 25px;
            border-bottom: 1px solid var(--accents-2);
            padding-bottom: 15px;
        }

        .user-box label {
            display: block;
            font-size: 0.7rem;
            color: var(--gray);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .input-user {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        /* Cor do placeholder personalizada */
        .input-user::placeholder { color: var(--accents-2); opacity: 1; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
            padding: 15px;
            background: var(--accents-1);
            border-radius: 8px;
            border: 1px solid var(--accents-2);
        }

        input, select {
            background: var(--bg);
            border: 1px solid var(--accents-2);
            border-radius: 6px;
            padding: 12px;
            color: white;
            font-size: 16px;
        }

        .btn-main {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .item-card {
            border-bottom: 1px solid var(--accents-2);
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info b { display: block; font-size: 0.9rem; text-transform: uppercase; }
        .info span { color: var(--gray); font-size: 0.8rem; }

        .item-actions { display: flex; gap: 15px; }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--gray); }

        .footer {
            margin-top: 40px;
            text-align: center;
        }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--accents-2);
            color: white;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-danger {
            margin-top: 30px;
            background: transparent;
            color: var(--red);
            border: 1px solid var(--accents-2);
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">KLEBER <span class="version">V.1</span></div>
        <div style="color: var(--gray); font-size: 10px;">Crie sua Lista de compras agora!</div>
    </div>

    <div class="user-box">
        <label>Responsável</label>
        <input type="text" id="userName" class="input-user" placeholder="DIGITE SEU NOME" oninput="saveUser()">
    </div>

    <div class="input-group">
        <input type="hidden" id="editIndex" value="-1">
        <input type="text" id="pNome" placeholder="Descrição do material" autocomplete="off">
        <div style="display: flex; gap: 8px;">
            <input type="number" id="pQtd" placeholder="Qtd" style="flex: 1;">
            <select id="pMed" style="flex: 1;">
                <option value="UN">UNIDADE</option>
                <option value="MT">METROS</option>
                <option value="CX">CAIXA</option>
                <option value="PC">PEÇA</option>
            </select>
        </div>
        <button id="btnSubmit" class="btn-main" onclick="handleSubmit()">ADICIONAR ITEM</button>
    </div>

    <div id="listaContainer"></div>

    <div class="footer">
        <div class="btn-row">
            <button class="btn-outline" onclick="exportPDF()">GERAR PDF</button>
            <button class="btn-outline" onclick="exportExcel()">EXCEL</button>
        </div>
        <button class="btn-danger" onclick="clearList()">Limpar Lista Atual</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('kleber_v151')) || [];
    document.getElementById('userName').value = localStorage.getItem('kleber_user') || '';

    render();

    function saveUser() {
        localStorage.setItem('kleber_user', document.getElementById('userName').value);
    }

    function handleSubmit() {
        const n = document.getElementById('pNome');
        const q = document.getElementById('pQtd');
        const m = document.getElementById('pMed');
        const index = document.getElementById('editIndex').value;

        if(!n.value || !q.value) return;

        const item = { nome: n.value.toUpperCase(), qtd: q.value, med: m.value };

        if(index === "-1") {
            db.push(item);
        } else {
            db[index] = item;
            document.getElementById('editIndex').value = "-1";
            document.getElementById('btnSubmit').innerText = "ADICIONAR ITEM";
            document.getElementById('btnSubmit').style.background = "#fff";
        }

        n.value = ''; q.value = ''; n.focus();
        save();
    }

    function save() {
        localStorage.setItem('kleber_v151', JSON.stringify(db));
        render();
    }

    function edit(i) {
        const item = db[i];
        document.getElementById('pNome').value = item.nome;
        document.getElementById('pQtd').value = item.qtd;
        document.getElementById('pMed').value = item.med;
        document.getElementById('editIndex').value = i;
        document.getElementById('btnSubmit').innerText = "SALVAR ALTERAÇÃO";
        document.getElementById('btnSubmit').style.background = "#0070f3";
        document.getElementById('btnSubmit').style.color = "#fff";
        window.scrollTo(0,0);
    }

    function remove(i) {
        if(confirm("Remover este item?")) {
            db.splice(i, 1);
            save();
        }
    }

    function clearList() {
        if(db.length === 0) return;
        if(confirm("Deseja apagar todos os itens desta lista?")) {
            db = [];
            save();
        }
    }

    function render() {
        const container = document.getElementById('listaContainer');
        container.innerHTML = '';
        db.forEach((it, i) => {
            container.innerHTML += `
                <div class="item-card">
                    <div class="info">
                        <b>${it.nome}</b>
                        <span>${it.qtd} ${it.med}</span>
                    </div>
                    <div class="item-actions">
                        <button class="btn-icon" onclick="edit(${i})">✎</button>
                        <button class="btn-icon" style="color:var(--red)" onclick="remove(${i})">✕</button>
                    </div>
                </div>
            `;
        });
    }

    function exportExcel() {
        if(db.length === 0) return;
        const user = document.getElementById('userName').value || "Não informado";
        const ws = XLSX.utils.json_to_sheet(db.map(i => ({ "Responsável": user, "Produto": i.nome, "Qtd": i.qtd, "Medida": i.med })));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Requisição");
        XLSX.writeFile(wb, `Lista_Kleber.xlsx`);
    }

    function exportPDF() {
        if(db.length === 0) return;
        const user = document.getElementById('userName').value || "Não informado";
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const dataAtual = new Date().toLocaleDateString('pt-BR');

        doc.setFontSize(18);
        doc.setFont("helvetica", "bold");
        doc.text("KLEBER V.1", 14, 18);

        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(80);
        doc.text(`RESPONSÁVEL: ${user.toUpperCase()}`, 14, 25);

        doc.setFontSize(11);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(0);
        doc.text("DOCUMENTO: LISTA DE COMPRAS", 14, 35);
        doc.text(`DATA: ${dataAtual}`, 14, 40);

        doc.autoTable({
            head: [['Descrição do Material', 'Quantidade', 'Und']],
            body: db.map(i => [i.nome, i.qtd, i.med]),
            startY: 45,
            theme: 'plain',
            headStyles: { fontStyle: 'bold', borderBottom: 1, textColor: [0, 0, 0] }
        });

        doc.save(`Lista_Kleber.pdf`);
    }
</script>

</body>
</html>
