<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kleber v.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --accents-1: #111111;
            --accents-2: #333333;
            --text: #ffffff;
            --gray: #888888;
            --blue: #0070f3;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: env(safe-area-inset-top) 15px 40px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }

        /* Header Vercel Style */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .brand { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.05rem; }
        .version {
            background: #ffffff; color: #000;
            padding: 2px 8px; border-radius: 5px;
            font-size: 0.65rem; margin-left: 8px;
        }

        /* Inputs */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        input, select {
            background: var(--accents-1);
            border: 1px solid var(--accents-2);
            border-radius: 6px;
            padding: 14px;
            color: white;
            font-size: 16px;
            transition: all 0.2s;
        }

        input:focus { border-color: var(--text); outline: none; }

        .btn-add {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-add:active { transform: scale(0.98); opacity: 0.8; }

        /* Lista */
        .item-card {
            background: var(--bg);
            border-bottom: 1px solid var(--accents-2);
            padding: 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info b { display: block; font-size: 1rem; margin-bottom: 4px; }
        .item-info span { color: var(--gray); font-size: 0.85rem; }

        .btn-del {
            background: transparent;
            color: #ff4d4d;
            border: 1px solid transparent;
            padding: 8px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Footer Fixed */
        .footer {
            margin-top: 50px;
            text-align: center;
            border-top: 1px solid var(--accents-2);
            padding-top: 20px;
        }

        .total-badge { color: var(--gray); margin-bottom: 20px; font-size: 0.9rem; }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-sec {
            background: transparent;
            border: 1px solid var(--accents-2);
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-sec:hover { border-color: var(--text); }

        .clear-list {
            margin-top: 30px;
            color: #ff4d4d;
            font-size: 0.75rem;
            text-decoration: underline;
            cursor: pointer;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">KLEBER <span class="version">V.1</span></div>
        <div style="color: var(--gray); font-size: 11px;">SETOR DE MANUTENÇÃO</div>
    </div>

    <div class="input-group">
        <input type="text" id="pNome" placeholder="O que você precisa?" autocomplete="off">
        <div style="display: flex; gap: 10px;">
            <input type="number" id="pQtd" placeholder="Qtd" style="flex: 1;">
            <select id="pMed" style="flex: 1;">
                <option value="UN">UNIDADE</option>
                <option value="MT">METROS</option>
                <option value="CX">CAIXA</option>
                <option value="PC">PEÇA</option>
            </select>
        </div>
        <button class="btn-add" onclick="addItem()">ADICIONAR À LISTA</button>
    </div>

    <div id="listaContainer">
        </div>

    <div class="footer">
        <div class="total-badge">Total: <span id="count">0</span> itens carregados</div>
        <div class="action-btns">
            <button class="btn-sec" onclick="exportPDF()">GERAR PDF</button>
            <button class="btn-sec" onclick="exportExcel()">EXCEL</button>
        </div>
        <div class="clear-list" onclick="clearList()">LIMPAR TUDO</div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('kleber_data')) || [];
    render();

    function addItem() {
        const n = document.getElementById('pNome');
        const q = document.getElementById('pQtd');
        const m = document.getElementById('pMed');

        if(!n.value || !q.value) return;

        db.push({ nome: n.value.toUpperCase(), qtd: q.value, med: m.value });
        save();
        n.value = ''; q.value = ''; n.focus();
    }

    function save() {
        localStorage.setItem('kleber_data', JSON.stringify(db));
        render();
    }

    function render() {
        const container = document.getElementById('listaContainer');
        container.innerHTML = '';
        db.forEach((it, i) => {
            container.innerHTML += `
                <div class="item-card">
                    <div class="item-info">
                        <b>${it.nome}</b>
                        <span>${it.qtd} ${it.med}</span>
                    </div>
                    <button class="btn-del" onclick="remove(${i})">✕</button>
                </div>
            `;
        });
        document.getElementById('count').innerText = db.length;
    }

    function remove(i) {
        db.splice(i, 1);
        save();
    }

    function clearList() {
        if(confirm("Deseja apagar toda a lista?")) {
            db = [];
            save();
        }
    }

    function exportExcel() {
        if(db.length === 0) return;
        const ws = XLSX.utils.json_to_sheet(db);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Lista");
        XLSX.writeFile(wb, "Kleber_Lista.xlsx");
    }

    function exportPDF() {
        if(db.length === 0) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(18);
        doc.text("KLEBER V.1.1 - REQUISIÇÃO T.I.", 14, 20);
        doc.autoTable({
            head: [['Descrição', 'Qtd', 'Unidade']],
            body: db.map(i => [i.nome, i.qtd, i.med]),
            startY: 30,
            theme: 'plain',
            headStyles: { fontStyle: 'bold', borderBottom: 1 }
        });
        doc.save("Lista_Kleber.pdf");
    }
</script>

</body>
</html>
