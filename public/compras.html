<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguardando o T.I</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #060709;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            /* Animação do Relâmpago */
            animation: lightning 8s infinite ease-in-out;
        }

        /* Animação que simula flashes de raios */
        @keyframes lightning {
            0%, 94%, 98%, 100% { background-color: #060709; }
            95% { background-color: #1a1c23; }
            96% { background-color: #4a5169; }
            97% { background-color: #060709; }
            99% { background-color: #3b4254; }
        }

        /* Efeito de Chuva Forte */
        .rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .drop {
            position: absolute;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.4));
            width: 1.5px; /* Gotas levemente mais grossas */
            height: 120px; /* Gotas mais longas para parecerem mais rápidas */
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-150px) translateX(50px); /* Leve inclinação para o vento */
            }
            100% {
                transform: translateY(100vh) translateX(-50px);
            }
        }

        /* Conteúdo Principal */
        .container {
            text-align: center;
            z-index: 2;
            padding: 35px;
            background: rgba(6, 7, 9, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-width: 90%;
            width: 550px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #a6b8bb;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="rain" id="rainContainer"></div>

    <div class="container">
        <h1>Temporariamente desativado<br>LIGUE P/ Suporte 91983252639</h1>
    </div>

    <script>
        const rainContainer = document.getElementById('rainContainer');
        const dropCount = 300; // Tempestade: aumentado de 100 para 300 gotas

        function createRain() {
            for (let i = 0; i < dropCount; i++) {
                const drop = document.createElement('div');
                drop.classList.add('drop');

                // Posição horizontal distribuída
                drop.style.left = Math.random() * 120 + 'vw'; // Margem maior por causa da inclinação do vento

                // Velocidade bem mais rápida (entre 0.3s e 0.6s para cruzar a tela)
                const duration = Math.random() * 0.3 + 0.3;
                const delay = Math.random() * 2;

                drop.style.animationDuration = duration + 's';
                drop.style.animationDelay = '-' + delay + 's';

                // Opacidade variada para efeito de profundidade na tempestade
                drop.style.opacity = Math.random() * 0.6;
                drop.style.height = (Math.random() * 60 + 80) + 'px';

                rainContainer.appendChild(drop);
            }
        }

        createRain();
    </script>
</body>
</html>
